  <!-- ESPTOOL-JS v0.7.0 (ESP32 / ESP32-S3 / ESP32-C5 / ESP32-C6) -->
  <script type="module">
    import { Transport, ESPLoader, bstrToUi8 } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.7.0/+esm';

    const toModuleUint8Array = (input) => {
      if (!input) return new Uint8Array(0);
      if (input instanceof Uint8Array) {
        return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
      }
      if (input instanceof ArrayBuffer) {
        return new Uint8Array(input);
      }
      if (input.buffer && input.buffer instanceof ArrayBuffer) {
        return new Uint8Array(input.buffer, input.byteOffset || 0, input.byteLength || input.buffer.byteLength);
      }
      if (typeof input === 'string') {
        return bstrToUi8 ? bstrToUi8(input) : new TextEncoder().encode(input);
      }
      return new Uint8Array(input);
    };

    const origWriteFlash = ESPLoader.prototype.writeFlash;
    ESPLoader.prototype.writeFlash = async function(options) {
      if (options && Array.isArray(options.fileArray)) {
        for (let i = 0; i < options.fileArray.length; i++) {
          const item = options.fileArray[i];
          if (item && item.data !== undefined) {
            item.data = toModuleUint8Array(item.data);
          }
        }
      }
      return await origWriteFlash.call(this, options);
    };

    window.ESP_TOOLS = {
      Transport,
      ESPLoader,
      bstrToUi8,
      toUint8Array: toModuleUint8Array
    };
    window.dispatchEvent(new Event('esptool_ready'));
  </script>

// Web Audio Synthesizer cho SFX hacker retro
const playHackerSfx = (type, enabled) => {
  if (!enabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    if (type === 'blip') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.025);
      gain.gain.setValueAtTime(0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
      osc.start(now);
      osc.stop(now + 0.025);
    } else if (type === 'connect') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(1760, now + 0.07);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
      osc.start(now);
      osc.stop(now + 0.07);
    } else if (type === 'flash') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'success') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.05);
      osc.frequency.setValueAtTime(783.99, now + 0.1);
      gain.gain.setValueAtTime(0.05, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  } catch (e) {}
};

// Component Canvas Nền Động (Matrix Rain / Radar Grid)
function CyberCanvas({
  mode
}) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || mode === 'off') return;
    const ctx = canvas.getContext('2d');
    let animationId;
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const handleResize = () => {
      if (!canvas) return;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', handleResize);

    // Matrix Rain
    const chars = "01ABCDEF0123456789BRUCEμΩλπ∑⚡⚔️📡";
    const fontSize = 12;
    const columns = Math.floor(width / fontSize);
    const drops = new Array(columns).fill(1).map(() => Math.floor(Math.random() * -60));

    // Radar particles
    let angle = 0;
    const particles = Array.from({
      length: 40
    }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      size: Math.random() * 2 + 1
    }));
    const render = () => {
      if (mode === 'matrix') {
        ctx.fillStyle = 'rgba(5, 6, 8, 0.14)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          const x = i * fontSize;
          const y = drops[i] * fontSize;
          if (Math.random() > 0.88) {
            ctx.fillStyle = '#6ee7b7';
          } else {
            ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
          }
          ctx.fillText(text, x, y);
          if (y > height && Math.random() > 0.985) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      } else if (mode === 'radar') {
        ctx.fillStyle = 'rgba(5, 6, 8, 0.2)';
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
        ctx.lineWidth = 1;
        const gridSize = 55;
        for (let x = 0; x < width; x += gridSize) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
          ctx.stroke();
        }
        for (let y = 0; y < height; y += gridSize) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
        particles.forEach((p, idx) => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          for (let j = idx + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
            if (dist < 110) {
              ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 110)})`;
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        });
        angle += 0.007;
        const cx = width / 2;
        const cy = height / 2;
        const radius = Math.min(width, height) * 0.42;
        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
        grad.addColorStop(0, 'rgba(0, 255, 102, 0.04)');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
        ctx.stroke();
      }
      animationId = requestAnimationFrame(render);
    };
    render();
    return () => {
      window.removeEventListener('resize', handleResize);
      cancelAnimationFrame(animationId);
    };
  }, [mode]);
  if (mode === 'off') return null;

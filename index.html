      if (!input) return new Uint8Array(0);
      if (input instanceof Uint8Array) {
        return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
      }
      if (input instanceof ArrayBuffer) {
        return new Uint8Array(input);
      }
      if (input.buffer && input.buffer instanceof ArrayBuffer) {
        return new Uint8Array(input.buffer, input.byteOffset || 0, input.byteLength || input.buffer.byteLength);
      }
      if (typeof input === 'string') {

      }
      return new Uint8Array(input);
    };

    const origWriteFlash = ESPLoader.prototype.writeFlash;
    ESPLoader.prototype.writeFlash = async function(options) {
      if (options && Array.isArray(options.fileArray)) {
        for (let i = 0; i < options.fileArray.length; i++) {
          const item = options.fileArray[i];
          if (item && item.data !== undefined) {
            item.data = toModuleUint8Array(item.data);
          }
        }
      }
      return await origWriteFlash.call(this, options);
    };

      Transport,

      bstrToUi8,

    // Web Audio Synthesizer cho SFX hacker retro
    const playHackerSfx = (type, enabled) => {
      if (!enabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'blip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.025);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
          osc.start(now);
          osc.stop(now + 0.025);
        } else if (type === 'connect') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1760, now + 0.07);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'flash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.05);
          osc.frequency.setValueAtTime(783.99, now + 0.1);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch(e) {}
    };

    // Component Canvas Nền Động (Matrix Rain / Radar Grid)
    function CyberCanvas({ mode }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || mode === 'off') return;
        const ctx = canvas.getContext('2d');
        let animationId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Matrix Rain
        const chars = "01ABCDEF0123456789BRUCEμΩλπ∑⚡⚔️📡";
        const fontSize = 12;
        const columns = Math.floor(width / fontSize);
        const drops = new Array(columns).fill(1).map(() => Math.floor(Math.random() * -60));

        // Radar particles
        let angle = 0;
        const particles = Array.from({ length: 40 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          size: Math.random() * 2 + 1
        }));

        const render = () => {
          if (mode === 'matrix') {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.14)';
            ctx.fillRect(0, 0, width, height);
            ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;

            for (let i = 0; i < drops.length; i++) {
              const text = chars[Math.floor(Math.random() * chars.length)];
              const x = i * fontSize;
              const y = drops[i] * fontSize;

              if (Math.random() > 0.88) {
                ctx.fillStyle = '#6ee7b7';
              } else {
                ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
              }
              ctx.fillText(text, x, y);

              if (y > height && Math.random() > 0.985) {
                drops[i] = 0;
              }
              drops[i]++;
            }
          } else if (mode === 'radar') {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 55;
            for (let x = 0; x < width; x += gridSize) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x, height);
              ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(width, y);
              ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
            particles.forEach((p, idx) => {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();

              for (let j = idx + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 110) {
                  ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 110)})`;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              }
            });

            angle += 0.007;
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(width, height) * 0.42;
            const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
            grad.addColorStop(0, 'rgba(0, 255, 102, 0.04)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
            ctx.stroke();
          }

          animationId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationId);
        };
      }, [mode]);

      if (mode === 'off') return null;

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-0 opacity-45 mix-blend-screen"
        />
      );
    }

                      <span className="text-cyber-amber font-bold">{p.gpio}</span>
                    </li>
                  ))}
                </ul>
              </div>
            )}

            {bData.controls && bData.controls.length > 0 && (filter === 'all' || filter === 'controls') && (
              <div className="bg-cyber-surface/90 border border-cyber-border rounded p-3">
                <div className="font-bold text-cyber-green flex items-center gap-1.5 pb-2 border-b border-cyber-border mb-2 glow-green">
                  <i className="fa-solid fa-gamepad text-xs"></i>
                  <span>{isVi ? "5. PHÍM BẤM & ĐIỀU HƯỚNG" : "5. CONTROLS & BUTTONS"}</span>
                </div>
                <ul className="space-y-1 text-[11px]">
                  {bData.controls.map((c, idx) => (
                    <li key={idx} className="flex justify-between items-center py-0.5 border-b border-cyber-border/30">
                      <span className="text-zinc-300">{c.name}:</span>
                      <div className="text-right">
                        <span className="text-cyber-green font-bold">{c.gpio}</span>
                        {c.note && <div className="text-[10px] text-zinc-500 font-sans">{c.note}</div>}
                      </div>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>

          {/* Ngoại vi & Cổng I2C / Cảm biến */}
          {bData.peripherals && bData.peripherals.length > 0 && (filter === 'all') && (
            <div className="bg-cyber-surface/90 border border-cyber-border rounded p-3">
              <div className="font-bold text-cyber-cyan flex items-center gap-1.5 pb-2 border-b border-cyber-border mb-2 glow-cyan">
                <i className="fa-solid fa-microchip text-xs"></i>
                <span>{isVi ? "6. CỔNG MỞ RỘNG I2C / CẢM BIẾN / ĐÈN LED" : "6. I2C GROVE / SENSORS / LEDS"}</span>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px]">
                {bData.peripherals.map((pe, idx) => (
                  <div key={idx} className="flex justify-between items-center p-1.5 bg-cyber-void/60 rounded border border-cyber-border/50">
                    <span className="text-zinc-300">{pe.name}:</span>
                    <span className="text-cyber-cyan font-bold">{pe.gpio}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Mẹo nối dây thực tế */}
          {bData.tips && (
            <div className="bg-cyber-green/5 border-l-2 border-cyber-green border-y border-r border-cyber-green/20 rounded-r p-3 text-[11px]">
              <div className="font-bold text-cyber-green flex items-center gap-1.5 mb-1 glow-green">
                <i className="fa-solid fa-lightbulb text-xs"></i>
                <span>{isVi ? "MẸO KẾT NỐI & VẬN HÀNH THỰC TẾ CHO BO MẠCH NÀY" : "PRACTICAL HARDWARE WIRING TIPS"}</span>
              </div>
              <p className="text-zinc-300 leading-relaxed font-sans">{bData.tips}</p>
            </div>
          )}

        </div>
      );
    }

    function App() {
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      const [eraseFlash, setEraseFlash] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [selectedBoardId, setSelectedBoardId] = useState('Morph-s3');
      const [localFile, setLocalFile] = useState(null);
      const [flashOffset, setFlashOffset] = useState('0x0000');
      
      // GitHub live detection
      const [githubFiles, setGithubFiles] = useState({});
      const [isFetchingGithub, setIsFetchingGithub] = useState(false);
      const [logoUrl, setLogoUrl] = useState(GITHUB_RAW_BASE + "IMG_4498.jpeg");

      // Chip info
      const [chipInfo, setChipInfo] = useState(null);

      // Flash & Terminal state
      const [isFlashing, setIsFlashing] = useState(false);
      const [isErasingOnly, setIsErasingOnly] = useState(false);
      const [progress, setProgress] = useState(0);
      const [logTab, setLogTab] = useState('pinout'); // Mặc định hiển thị sơ đồ chân khi chưa kết nối
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);
      const [isMonitor, setIsMonitor] = useState(false);
      const [monitorBaud, setMonitorBaud] = useState(115200);

      // Hacker Settings (Nền động, CRT Scanlines, SFX Audio)
      const [bgMode, setBgMode] = useState(() => localStorage.getItem('duscu_bg_mode') || 'matrix');
      const [crtEnabled, setCrtEnabled] = useState(() => localStorage.getItem('duscu_crt') !== 'false');
      const [sfxEnabled, setSfxEnabled] = useState(() => localStorage.getItem('duscu_sfx') === 'true');

      // Ticking UTC Clock
      const [utcTime, setUtcTime] = useState(new Date().toUTCString().replace("GMT", "UTC"));
      useEffect(() => {
        const timer = setInterval(() => {
          setUtcTime(new Date().toUTCString().replace("GMT", "UTC"));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Morph S3 User Manual Modal State
      const [showMorphGuide, setShowMorphGuide] = useState(false);
      const [guideTab, setGuideTab] = useState('controls');

      // Quản lý Ngôn ngữ
      const [lang, setLang] = useState(() => {
        const saved = localStorage.getItem('duscu_lang');
        if (saved === 'vi' || saved === 'en') return saved;
        return 'vi';
      });

      const t = I18N[lang] || I18N.vi;

      const toggleLang = () => {
        const nextLang = lang === 'vi' ? 'en' : 'vi';
        setLang(nextLang);
        localStorage.setItem('duscu_lang', nextLang);
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleBgMode = () => {
        const modes = ['matrix', 'radar', 'off'];
        const nextMode = modes[(modes.indexOf(bgMode) + 1) % modes.length];
        setBgMode(nextMode);
        localStorage.setItem('duscu_bg_mode', nextMode);
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleCrt = () => {
        const nextCrt = !crtEnabled;
        setCrtEnabled(nextCrt);
        localStorage.setItem('duscu_crt', String(nextCrt));
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleSfx = () => {
        const nextSfx = !sfxEnabled;
        setSfxEnabled(nextSfx);
        localStorage.setItem('duscu_sfx', String(nextSfx));
        playHackerSfx('connect', nextSfx);
      };

      const termRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const activeTransportRef = useRef(null);
      const isMonitorRef = useRef(false);
      const autoResumeMonitorRef = useRef(false);
      const logTabRef = useRef(logTab);
      useEffect(() => { logTabRef.current = logTab; }, [logTab]);
      const monitorBaudRef = useRef(monitorBaud);
      useEffect(() => { monitorBaudRef.current = monitorBaud; }, [monitorBaud]);

      const releaseAndClosePort = async (port) => {
        if (!port) return;
        if (activeTransportRef.current) {
          try { await activeTransportRef.current.disconnect(); } catch(e) {}
          activeTransportRef.current = null;
        }
        if (transportRef.current) {
          try { await transportRef.current.disconnect(); } catch(e) {}
          transportRef.current = null;
        }
        if (readerRef.current) {
          try { await readerRef.current.cancel(); } catch(e) {}
          try { readerRef.current.releaseLock(); } catch(e) {}
          readerRef.current = null;
        }
        try {
          if (port.readable || port.writable) {
            await port.close();
          }
        } catch(e) {}
      };

      const logSys = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg, type }]);
      };
      const logDev = (msg) => {
        setDevLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg }]);
      };

      const fetchGithubContents = async () => {
        setIsFetchingGithub(true);
        playHackerSfx('blip', sfxEnabled);
        try {
          const res = await fetch(GITHUB_API_URL + '?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (res.ok) {
            const data = await res.json();
            const map = {};
            if (Array.isArray(data)) {
              data.forEach(item => {
                if (item.name && item.name.endsWith('.bin')) {
                  map[item.name] = { size: item.size, download_url: item.download_url };
                }
              });
            }
            setGithubFiles(map);
            logSys(`[SYNC] Đã đồng bộ ${Object.keys(map).length} file firmware từ GitHub repository.`, 'success');
            playHackerSfx('success', sfxEnabled);
          } else {
            logSys(`[WARN] GitHub API: Sử dụng danh mục mặc định (${res.status})`, 'warning');
          }
        } catch(e) {
          logSys(`[WARN] GitHub API: ${e.message}`, 'warning');
        } finally {
          setIsFetchingGithub(false);
        }
      };

      useEffect(() => {
        fetchGithubContents();
      }, []);

      const connectSerial = async () => {
        if (!navigator.serial) {
          alert("Trình duyệt không hỗ trợ Web Serial API. Vui lòng mở bằng Google Chrome hoặc MS Edge trên PC.");
          return;
        }
        playHackerSfx('blip', sfxEnabled);
        try {
          const port = await navigator.serial.requestPort();
          await releaseAndClosePort(port);
          portRef.current = port;
          setIsConnected(true);
          setLogTab('sys');
          logSys("[PORT] Đã kết nối cổng COM thành công.", 'success');
          playHackerSfx('connect', sfxEnabled);
        } catch (err) {
          if (err.name !== 'NotFoundError') {
            logSys(`[ERR] Lỗi kết nối cổng: ${err.message}`, 'error');
          }
        }
      };

      const disconnectSerial = async () => {
        playHackerSfx('blip', sfxEnabled);
        if (isMonitor) await stopMonitor(true);
        await releaseAndClosePort(portRef.current);
        portRef.current = null;
        setIsConnected(false);
        setChipInfo(null);
        logSys("[PORT] Đã ngắt kết nối cổng COM.", 'warning');
      };

      const handleFlash = async () => {
        if (!isConnected || !portRef.current) {
          alert("Vui lòng kết nối thiết bị trước khi nạp!");
          return;
        }
        const targetBoard = MASTER_BOARDS.find(b => b.id === selectedBoardId);
        if (!localFile && !targetBoard) {
          alert("Chưa chọn bo mạch đích hoặc file firmware .bin!");
          return;
        }

        playHackerSfx('flash', sfxEnabled);
        setIsFlashing(true);
        setLogTab('sys');
        setProgress(0);

        try {
          let binData;
          if (localFile) {
            logSys(`[FILE] Nạp file cục bộ: ${localFile.name} [${(localFile.size / 1024 / 1024).toFixed(2)} MB]`, 'info');
            binData = await localFile.arrayBuffer();
          } else {
            logSys(`[FETCH] Đang tải firmware: ${targetBoard.url}...`, 'info');
            const res = await fetch(GITHUB_RAW_BASE + targetBoard.url + '?t=' + Date.now());
            if (!res.ok) throw new Error(`Không tìm thấy file firmware ${targetBoard.url}`);
            binData = await res.arrayBuffer();
          }

          const { Transport, ESPLoader, toUint8Array } = window.ESP_TOOLS;
          const transport = new Transport(portRef.current, true);
          transportRef.current = transport;

          const esploader = new ESPLoader({
            transport,
            baudrate: parseInt(baudRate),
            terminal: {
              clean: () => {},
              writeLine: (data) => logSys(data),
              write: (data) => logSys(data)
            }
          });

          logSys(`[SYNC] Đồng bộ bootloader @ ${baudRate} baud...`, 'info');
          await esploader.main();
          setChipInfo({ chip: esploader.chip ? esploader.chip.CHIP_NAME : 'ESP32 Device', mac: 'CONNECTED' });

          const addr = parseInt(flashOffset, 16) || 0x0;
          logSys(`[WRITE] Ghi bộ nhớ tại địa chỉ 0x${flashOffset} ${eraseFlash ? '(Xóa toàn bộ Flash)' : ''}...`, 'info');

          const fileArray = [{ data: toUint8Array(binData), address: addr }];
          await esploader.writeFlash({
            fileArray,
            flashSize: 'keep',
            eraseAll: eraseFlash,
            compress: true,
            reportProgress: (fileIndex, written, total) => {
              const p = Math.round((written / total) * 100);
              setProgress(p);
            }
          });

          logSys("[SUCCESS] GHI FIRMWARE HOÀN TẤT THÀNH CÔNG 100%.", 'success');
          playHackerSfx('success', sfxEnabled);
          logSys("[REBOOT] Đang khởi động lại thiết bị...", 'info');
          await esploader.hardReset();
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } catch(err) {
          logSys(`[FAIL] Ghi Firmware thất bại: ${err.message}`, 'error');
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } finally {
          setIsFlashing(false);
        }
      };

      const handleErase = async () => {
        if (!isConnected || !portRef.current) return;
        if (!confirm(t.eraseConfirm)) return;

        playHackerSfx('flash', sfxEnabled);
        setIsErasingOnly(true);
        setLogTab('sys');

        try {
          const { Transport, ESPLoader } = window.ESP_TOOLS;
          const transport = new Transport(portRef.current, true);
          transportRef.current = transport;

          const esploader = new ESPLoader({
            transport,
            baudrate: parseInt(baudRate),
            terminal: {
              clean: () => {},
              writeLine: (data) => logSys(data),
              write: (data) => logSys(data)
            }
          });

          logSys("[CMD] Bắt đầu xóa sạch toàn bộ Flash chip...", 'warning');
          await esploader.main();
          await esploader.eraseFlash();
          logSys("[SUCCESS] ĐÃ XÓA SẠCH TOÀN BỘ CHIP FLASH THÀNH CÔNG.", 'success');
          playHackerSfx('success', sfxEnabled);
          await esploader.hardReset();
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } catch(err) {
          logSys(`[FAIL] Lỗi xóa Flash: ${err.message}`, 'error');
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } finally {
          setIsErasingOnly(false);
        }
      };

      const startMonitor = async () => {
        if (!portRef.current) return;
        playHackerSfx('blip', sfxEnabled);
        try {
          if (portRef.current.readable || portRef.current.writable) {
            await releaseAndClosePort(portRef.current);
          }
          await portRef.current.open({ baudRate: parseInt(monitorBaud) });
          setIsMonitor(true);
          isMonitorRef.current = true;
          logDev(`[MONITOR] Bắt đầu đọc Serial @ ${monitorBaud} baud.`);
          readLoop();
        } catch(err) {
          logSys(`[ERR] Serial Monitor: ${err.message}`, 'error');
        }
      };

      const stopMonitor = async (manual = false) => {
        isMonitorRef.current = false;
        setIsMonitor(false);
        playHackerSfx('blip', sfxEnabled);
        await releaseAndClosePort(portRef.current);
      };

      const readLoop = async () => {
        while (portRef.current && portRef.current.readable && isMonitorRef.current) {
          try {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = portRef.current.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            readerRef.current = reader;

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              if (value) {
                const lines = value.split('\n');
                lines.forEach(line => {
                  if (line.trim()) logDev(line.replace(/\r/g, ''));
                });
              }
            }
          } catch(e) {
            break;
          }
        }
      };

      // Auto scroll console
      useEffect(() => {
        if (termRef.current) {
          termRef.current.scrollTop = termRef.current.scrollHeight;
        }
      }, [sysLogs, devLogs, logTab]);

      // Filter boards
      const filteredBoards = useMemo(() => {
        return MASTER_BOARDS.filter(b => {
          const matchCat = (selectedCategory === 'all') || 
                           (selectedCategory === 'hero' && b.isHero) ||
                           (b.category === selectedCategory);
          const matchSearch = !searchQuery || 
                              b.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              b.chip.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              b.id.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchSearch;
        });
      }, [selectedCategory, searchQuery]);

      return (
        <div className={`h-full flex flex-col relative ${crtEnabled ? 'crt-scanlines' : ''}`}>
          
          {/* Nền động tương tác */}
          <CyberCanvas mode={bgMode} />

          {/* TOP HUD HEADER */}
          <header className="h-12 border-b border-cyber-border bg-cyber-void/90 px-3 sm:px-4 flex items-center justify-between z-20 shrink-0 font-mono text-xs">
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 bg-cyber-green rounded-none pulse-tactical shadow-lg shadow-cyber-green/50"></span>
                <span className="font-extrabold tracking-widest text-zinc-100 glow-green text-sm">
                  DUSCU<span className="text-cyber-green">//</span>FLASHER
                </span>
              </div>
              <span className="hidden md:inline px-1.5 py-0.5 text-[10px] bg-cyber-surface border border-cyber-border text-zinc-400 font-bold">
                OS v3.0 TACTICAL
              </span>
              <span className="hidden lg:inline text-[11px] text-zinc-500">
                // {utcTime}
              </span>
            </div>

            {/* Tactical Status & Toggles */}
            <div className="flex items-center gap-2">
              {/* Nền động Toggle */}
              <button
                onClick={toggleBgMode}
                className="px-2 py-1 rounded bg-cyber-surface border border-cyber-border text-zinc-400 hover:text-cyber-cyan hover:border-cyber-cyan/50 transition-colors flex items-center gap-1 text-[11px]"
                title="Đổi hiệu ứng nền động (Matrix Rain / Radar Grid / Tắt)">
                <i className="fa-solid fa-network-wired text-[10px]"></i>
                <span className="hidden sm:inline">FX:</span>
                <span className="text-cyber-cyan font-bold uppercase">{bgMode}</span>
              </button>

              {/* CRT Toggle */}
              <button
                onClick={toggleCrt}
                className={`px-2 py-1 rounded border transition-colors flex items-center gap-1 text-[11px] ${
                  crtEnabled ? 'bg-cyber-green/10 border-cyber-green/50 text-cyber-green' : 'bg-cyber-surface border-cyber-border text-zinc-500'
                }`}
                title="Bật/Tắt hiệu ứng quét màn hình CRT">
                <i className="fa-solid fa-tv text-[10px]"></i>
                <span className="hidden sm:inline">CRT:</span>
                <span className="font-bold">{crtEnabled ? 'ON' : 'OFF'}</span>
              </button>

              {/* Audio SFX Toggle */}
              <button
                onClick={toggleSfx}
                className={`px-2 py-1 rounded border transition-colors flex items-center gap-1 text-[11px] ${
                  sfxEnabled ? 'bg-cyber-cyan/10 border-cyber-cyan/50 text-cyber-cyan' : 'bg-cyber-surface border-cyber-border text-zinc-500'
                }`}
                title="Bật/Tắt hiệu ứng âm thanh Hacker Web Audio">
                <i className={`fa-solid ${sfxEnabled ? 'fa-volume-high' : 'fa-volume-xmark'} text-[10px]`}></i>
                <span className="hidden sm:inline">SFX:</span>
                <span className="font-bold">{sfxEnabled ? 'ON' : 'OFF'}</span>
              </button>

              {/* Sync GitHub */}
              <button
                onClick={fetchGithubContents}
                disabled={isFetchingGithub}
                className="px-2.5 py-1 rounded bg-cyber-surface border border-cyber-border text-zinc-400 hover:text-cyber-green hover:border-cyber-green/50 transition-colors flex items-center gap-1 text-[11px]"
                title={t.syncTooltip}>
                <i className={`fa-solid fa-arrows-rotate text-[10px] ${isFetchingGithub ? 'fa-spin text-cyber-green' : ''}`}></i>
                <span className="hidden md:inline">{t.syncBtn}</span>
              </button>

              {/* Ngôn ngữ */}
              <button
                onClick={toggleLang}
                className="px-2 py-1 rounded bg-cyber-surface border border-cyber-border text-zinc-300 hover:text-white font-bold text-[11px]">
                {lang.toUpperCase()}
              </button>
            </div>
          </header>

          {/* MAIN WORKSPACE LAYOUT */}
          <main className="flex-1 flex flex-col lg:flex-row overflow-hidden relative z-10">

            {/* LEFT CONTROL PANEL */}
            <div className="w-full lg:w-[460px] xl:w-[490px] border-r border-cyber-border bg-cyber-surface/90 flex flex-col overflow-y-auto custom-scrollbar p-3 sm:p-4 space-y-4 shrink-0">
              
              {/* [0x01] SERIAL BUS CONNECTION */}
              <div className="bg-cyber-void/80 border border-cyber-border rounded p-3 relative overflow-hidden">
                <div className="flex items-center justify-between pb-2 border-b border-cyber-border/80 mb-3">
                  <span className="font-bold text-xs text-cyber-cyan glow-cyan flex items-center gap-1.5">
                    <i className="fa-solid fa-bolt text-xs"></i>
                    <span>{t.serialSec}</span>
                  </span>
                  <span className="flex items-center gap-1.5 text-[10px]">
                    <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-cyber-green shadow-lg shadow-cyber-green/50' : 'bg-zinc-600'}`}></span>
                    <span className={isConnected ? 'text-cyber-green font-bold' : 'text-zinc-500'}>
                      {isConnected ? t.portOnline : t.portOffline}
                    </span>
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2 mb-3">
                  <div>
                    <label className="text-[10px] text-zinc-500 block mb-1">BAUDRATE FLASH:</label>
                    <select
                      value={baudRate}
                      onChange={e => setBaudRate(e.target.value)}
                      disabled={isConnected || isFlashing}
                      className="w-full bg-cyber-surface border border-cyber-border text-zinc-200 text-xs px-2 py-1.5 rounded outline-none focus:border-cyber-cyan">
                      <option value="921600">921600 (SIÊU TỐC)</option>
                      <option value="460800">460800 (CAO)</option>
                      <option value="115200">115200 (TIÊU CHUẨN)</option>
                    </select>
                  </div>
                  <div>
                    <label className="text-[10px] text-zinc-500 block mb-1">OFFSET GHI:</label>
                    <input
                      type="text"
                      value={flashOffset}
                      onChange={e => setFlashOffset(e.target.value)}
                      disabled={isFlashing}
                      className="w-full bg-cyber-surface border border-cyber-border text-zinc-200 text-xs px-2 py-1.5 rounded outline-none font-mono focus:border-cyber-cyan"
                    />
                  </div>
                </div>

                <button
                  onClick={isConnected ? disconnectSerial : connectSerial}
                  disabled={isFlashing || isErasingOnly}
                  className={`w-full py-2.5 px-4 font-bold text-xs uppercase tracking-wider rounded transition-all flex items-center justify-center gap-2 ${
                    isConnected
                      ? 'bg-cyber-red/20 text-cyber-red border border-cyber-red hover:bg-cyber-red/30'
                      : 'bg-cyber-green text-cyber-void font-extrabold hover:bg-cyber-green/90 shadow-lg shadow-cyber-green/20'
                  }`}>
                  <i className={`fa-solid ${isConnected ? 'fa-link-slash' : 'fa-link'}`}></i>
                  <span>{isConnected ? t.disconnectBtn : t.connectBtn}</span>
                </button>
              </div>

              {/* [0x02] TARGET HARDWARE MATRIX */}
              <div className="bg-cyber-void/80 border border-cyber-border rounded p-3 flex flex-col flex-1 min-h-[300px]">
                <div className="flex items-center justify-between pb-2 border-b border-cyber-border/80 mb-2.5">
                  <span className="font-bold text-xs text-cyber-amber glow-amber flex items-center gap-1.5">
                    <i className="fa-solid fa-microchip text-xs"></i>
                    <span>{t.hardwareSec} [33]</span>
                  </span>
                  <span className="text-[10px] text-zinc-500">// ĐÃ CHỌN: <strong className="text-zinc-200">{selectedBoardId}</strong></span>
                </div>

                {/* Search Box */}
                <div className="relative mb-2">
                  <i className="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-zinc-500 text-xs"></i>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={e => setSearchQuery(e.target.value)}
                    placeholder={t.searchPlaceholder}
                    className="w-full bg-cyber-surface border border-cyber-border pl-8 pr-3 py-1.5 text-xs text-zinc-200 placeholder-zinc-600 rounded outline-none focus:border-cyber-amber"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2 text-zinc-500 hover:text-zinc-300 text-xs">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  )}
                </div>

                {/* Filter Pills */}
                <div className="flex flex-wrap gap-1 mb-2.5 text-[10px]">
                  {[
                    { id: 'all', label: t.filterAll },
                    { id: 'hero', label: t.filterHero },
                    { id: 's3', label: t.filterS3 },
                    { id: 'c5', label: t.filterC5 },
                    { id: 'esp32', label: t.filterEsp32 }
                  ].map(cat => (
                    <button
                      key={cat.id}
                      onClick={() => { setSelectedCategory(cat.id); playHackerSfx('blip', sfxEnabled); }}
                      className={`px-2 py-1 rounded border transition-colors ${
                        selectedCategory === cat.id
                          ? 'bg-cyber-amber/20 text-cyber-amber border-cyber-amber font-bold'
                          : 'bg-cyber-surface text-zinc-500 border-cyber-border hover:text-zinc-300'
                      }`}>
                      {cat.label}
                    </button>
                  ))}
                </div>

                {/* Board Cards List */}
                <div className="flex-1 overflow-y-auto custom-scrollbar space-y-1.5 max-h-[340px] pr-1">
                  {filteredBoards.map(board => {
                    const isSelected = (selectedBoardId === board.id);
                    return (
                      <div
                        key={board.id}
                        onClick={() => {
                          setSelectedBoardId(board.id);
                          setLocalFile(null);
                          playHackerSfx('blip', sfxEnabled);
                        }}
                        className={`p-2.5 rounded border transition-all cursor-pointer relative overflow-hidden ${
                          isSelected
                            ? 'bg-cyber-card border-cyber-green text-zinc-100 shadow-md shadow-cyber-green/10'
                            : 'bg-cyber-surface/60 border-cyber-border hover:border-zinc-700 text-zinc-300'
                        } ${board.isHero ? 'border-l-2 border-l-cyber-amber' : ''}`}>
                        
                        <div className="flex items-center justify-between gap-2">
                          <div className="flex items-center gap-2 truncate">
                            <i className={`fa-solid ${board.icon || 'fa-microchip'} text-xs ${isSelected ? 'text-cyber-green' : 'text-zinc-500'}`}></i>
                            <span className={`font-bold text-xs truncate ${isSelected ? 'text-cyber-green' : 'text-zinc-200'}`}>
                              {board.name}
                            </span>
                          </div>
                          <span className="text-[10px] px-1.5 py-0.2 rounded bg-zinc-900 border border-zinc-800 text-zinc-400 shrink-0">
                            {board.chip}
                          </span>
                        </div>

                        <p className="text-[11px] text-zinc-500 font-sans mt-1 line-clamp-1">
                          {board.desc}
                        </p>

                        {/* Nút Cẩm nang riêng cho Morph S3 */}
                        {board.id === 'Morph-s3' && (
                          <div className="mt-2 pt-1.5 border-t border-zinc-800 flex justify-between items-center text-[10px]">
                            <span className="text-cyber-amber font-bold flex items-center gap-1">
                              <i className="fa-solid fa-crown text-[9px]"></i> MORPH S3 HERO
                            </span>
                            <button
                              onClick={(e) => {
                                e.stopPropagation();
                                setShowMorphGuide(true);
                                playHackerSfx('blip', sfxEnabled);
                              }}
                              className="px-2 py-0.5 rounded bg-cyber-amber/20 text-cyber-amber border border-cyber-amber/40 hover:bg-cyber-amber/30 font-bold flex items-center gap-1">
                              <i className="fa-solid fa-book-open text-[9px]"></i>
                              <span>{t.morphGuideBtn}</span>
                            </button>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* [0x03] EXTERNAL BINARY PAYLOAD & ACTIONS */}
              <div className="bg-cyber-void/80 border border-cyber-border rounded p-3 space-y-3">
                <div className="flex items-center justify-between pb-1.5 border-b border-cyber-border/80">
                  <span className="font-bold text-xs text-cyber-green glow-green flex items-center gap-1.5">
                    <i className="fa-solid fa-file-code text-xs"></i>
                    <span>{t.externalSec}</span>
                  </span>
                  {localFile && (
                    <button
                      onClick={() => setLocalFile(null)}
                      className="text-[10px] text-cyber-red hover:underline">
                      {t.deselectFile}
                    </button>
                  )}
                </div>

                {/* File selector */}
                <label className={`block border border-dashed rounded p-2.5 text-center cursor-pointer transition-all ${
                  localFile
                    ? 'bg-cyber-green/10 border-cyber-green text-cyber-green font-bold'
                    : 'bg-cyber-surface/50 border-cyber-border hover:border-zinc-600 text-zinc-400'
                }`}>
                  <input
                    type="file"
                    accept=".bin"
                    onChange={e => {
                      if (e.target.files && e.target.files[0]) {
                        setLocalFile(e.target.files[0]);
                        playHackerSfx('blip', sfxEnabled);
                      }
                    }}
                    className="hidden"
                  />
                  <div className="flex items-center justify-center gap-2 text-xs">
                    <i className="fa-solid fa-cloud-arrow-up"></i>
                    <span className="truncate">{localFile ? `FILE: ${localFile.name}` : t.dropHint}</span>
                  </div>
                </label>

                {/* Erase option */}
                <label className="flex items-center gap-2 cursor-pointer text-xs text-zinc-400 hover:text-zinc-200">
                  <input
                    type="checkbox"
                    checked={eraseFlash}
                    onChange={e => setEraseFlash(e.target.checked)}
                    className="rounded bg-cyber-surface border-cyber-border text-cyber-amber focus:ring-0"
                  />
                  <span>{t.eraseBefore}</span>
                </label>

                {/* Action Buttons */}
                <div className="grid grid-cols-3 gap-2 pt-1">
                  <button
                    onClick={handleErase}
                    disabled={!isConnected || isFlashing || isErasingOnly}
                    className="py-2.5 px-2 bg-cyber-red/10 border border-cyber-red/40 text-cyber-red hover:bg-cyber-red/20 font-bold text-xs rounded transition-colors disabled:opacity-30">
                    <i className="fa-solid fa-trash-can mr-1"></i>
                    <span>{isErasingOnly ? 'ERASING...' : t.eraseAllBtn}</span>
                  </button>

                  <button
                    onClick={handleFlash}
                    disabled={!isConnected || isFlashing || isErasingOnly}
                    className="col-span-2 py-2.5 px-3 bg-cyber-green text-cyber-void font-extrabold text-xs uppercase tracking-wider rounded hover:bg-cyber-green/90 transition-all shadow-lg shadow-cyber-green/20 disabled:opacity-30 flex items-center justify-center gap-2">
                    <i className={`fa-solid ${isFlashing ? 'fa-spinner fa-spin' : 'fa-bolt'}`}></i>
                    <span>{isFlashing ? `${t.flashingBtn} (${progress}%)` : t.flashBtn}</span>
                  </button>
                </div>

                {/* Progress Bar */}
                {isFlashing && (
                  <div className="w-full bg-cyber-surface border border-cyber-border rounded h-2.5 overflow-hidden p-0.5">
                    <div
                      className="bg-gradient-to-r from-cyber-cyan to-cyber-green h-full transition-all duration-150"
                      style={{ width: `${progress}%` }}>
                    </div>
                  </div>
                )}
              </div>

            </div>

            {/* RIGHT TELEMETRY & PINOUT SCHEMATIC PANEL */}
            <div className="flex-1 flex flex-col bg-cyber-void/90 overflow-hidden min-w-0">
              
              {/* Tab Header Bar */}
              <div className="px-3 border-b border-cyber-border bg-cyber-surface/90 flex items-center justify-between shrink-0 h-10">
                <div className="flex h-full">
                  <button
                    onClick={() => { setLogTab('pinout'); playHackerSfx('blip', sfxEnabled); }}
                    className={`px-3.5 h-full text-xs font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-1.5 ${
                      logTab === 'pinout'
                        ? 'text-cyber-green border-cyber-green bg-cyber-green/10 glow-green'
                        : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-diagram-project text-[11px]"></i>
                    <span>{t.pinoutTab}</span>
                  </button>

                  <button
                    onClick={() => { setLogTab('sys'); playHackerSfx('blip', sfxEnabled); }}
                    className={`px-3.5 h-full text-xs font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-1.5 ${
                      logTab === 'sys'
                        ? 'text-cyber-amber border-cyber-amber bg-cyber-amber/10 glow-amber'
                        : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-terminal text-[11px]"></i>
                    <span>{t.sysLogTab}</span>
                  </button>

                  <button
                    onClick={() => { setLogTab('dev'); playHackerSfx('blip', sfxEnabled); }}
                    className={`px-3.5 h-full text-xs font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-1.5 ${
                      logTab === 'dev'
                        ? 'text-cyber-cyan border-cyber-cyan bg-cyber-cyan/10 glow-cyan'
                        : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-satellite-dish text-[11px]"></i>
                    <span>{t.serialMonTab}</span>
                  </button>
                </div>

                {/* Right utility buttons */}
                <div className="flex items-center gap-2">
                  {logTab === 'dev' && (
                    <div className="flex items-center gap-1.5">
                      <select
                        value={monitorBaud}
                        onChange={e => setMonitorBaud(e.target.value)}
                        disabled={isMonitor}
                        className="bg-cyber-void border border-cyber-border text-zinc-300 text-xs px-2 py-0.5 rounded outline-none font-mono">
                        <option value="115200">115200</option>
                        <option value="9600">9600</option>
                        <option value="921600">921600</option>
                      </select>
                      <button
                        onClick={isMonitor ? () => stopMonitor(true) : () => startMonitor()}
                        className={`px-2 py-0.5 rounded text-xs border font-bold flex items-center gap-1 ${
                          isMonitor ? 'bg-cyber-red/20 text-cyber-red border-cyber-red/50' : 'bg-cyber-cyan/20 text-cyber-cyan border-cyber-cyan/50'
                        }`}>
                        <i className={`fa-solid ${isMonitor ? 'fa-stop' : 'fa-play'} text-[9px]`}></i>
                        <span>{isMonitor ? t.stopMon : t.startMon}</span>
                      </button>
                    </div>
                  )}

                  {logTab !== 'pinout' && (
                    <button
                      onClick={() => logTab === 'sys' ? setSysLogs([]) : setDevLogs([])}
                      className="px-2 py-0.5 bg-cyber-void border border-cyber-border text-zinc-400 hover:text-zinc-200 rounded text-xs"
                      title={t.clearLogTooltip}>
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  )}
                </div>
              </div>

              {/* Viewport Content */}
              <div className="flex-1 overflow-hidden relative">
                {logTab === 'pinout' ? (
                  <PinoutViewer boardId={selectedBoardId} lang={lang} />
                ) : (
                  <div
                    ref={termRef}
                    className="h-full p-3 overflow-y-auto custom-scrollbar font-mono text-[11px] leading-relaxed text-zinc-300 select-text bg-cyber-void">
                    {(logTab === 'sys' ? sysLogs : devLogs).length === 0 ? (
                      <div className="text-zinc-600 select-none font-mono">
                        {logTab === 'sys' ? t.sysPlaceholder : t.monPlaceholder}
                      </div>
                    ) : (
                      (logTab === 'sys' ? sysLogs : devLogs).map((l, i) => (
                        <div key={i} className="flex gap-2 mb-1">
                          <span className="text-zinc-600 shrink-0 select-none">[{l.time}]</span>
                          <span className={`break-all ${
                            l.type === 'error' ? 'text-cyber-red font-bold' :
                            l.type === 'success' ? 'text-cyber-green font-bold' :
                            l.type === 'warning' ? 'text-cyber-amber' :
                            'text-zinc-300'
                          }`}>
                            {l.msg}
                          </span>
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>

              {/* Bottom Telemetry Status Bar */}
              <div className="h-7 px-3 border-t border-cyber-border bg-cyber-surface/90 flex items-center justify-between text-[10px] text-zinc-500 shrink-0 font-mono">
                <div className="flex items-center gap-3">
                  <span className="flex items-center gap-1.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isConnected ? 'bg-cyber-green' : 'bg-zinc-600'}`}></span>
                    <span className={isConnected ? 'text-cyber-green font-bold' : 'text-zinc-500'}>
                      {isConnected ? t.portOnline : t.portOffline}
                    </span>
                  </span>
                  {chipInfo && <span className="text-cyber-cyan">// CHIP: {chipInfo.chip}</span>}
                  <span className="hidden sm:inline">// HARDWARE TARGET: <strong className="text-zinc-300">{selectedBoardId}</strong></span>
                </div>
                <div className="flex items-center gap-2 text-zinc-500">
                  <span>ESPLoader v0.7.0</span>
                  <span>//</span>
                  <span className="text-cyber-green">STATUS: READY</span>
                </div>
              </div>

            </div>

          </main>

          {/* MORPH S3 USER MANUAL MODAL */}
          {showMorphGuide && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 select-text">
              <div className="bg-cyber-surface border border-cyber-border rounded-lg shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden relative">
                
                <div className="h-1 w-full bg-gradient-to-r from-cyber-red via-cyber-amber via-cyber-green to-cyber-cyan"></div>

                <div className="p-4 border-b border-cyber-border flex items-center justify-between gap-3 bg-cyber-void">
                  <div className="flex items-center gap-2.5">
                    <div className="w-3 h-3 bg-cyber-amber pulse-tactical"></div>
                    <div>
                      <h2 className="text-sm font-bold text-zinc-100 font-mono tracking-wide glow-amber">
                        {t.morphGuideTitle}
                      </h2>
                      <div className="text-[10px] text-zinc-500 font-mono">{t.morphGuideSub}</div>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowMorphGuide(false)}
                    className="w-7 h-7 rounded border border-cyber-border bg-cyber-surface text-zinc-400 hover:text-white flex items-center justify-center text-xs">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Modal Navigation Tabs */}
                <div className="px-4 py-2 border-b border-cyber-border bg-cyber-surface flex flex-wrap gap-1 text-[11px] font-mono">
                  {[
                    { id: 'controls', label: t.morphTabControls, icon: 'fa-gamepad' },
                    { id: 'hardware', label: t.morphTabHardware, icon: 'fa-microchip' },
                    { id: 'webui', label: t.morphTabWebui, icon: 'fa-globe' },
                    { id: 'flash', label: t.morphTabFlash, icon: 'fa-bolt' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setGuideTab(tab.id)}
                      className={`px-3 py-1 rounded border transition-colors flex items-center gap-1.5 ${
                        guideTab === tab.id
                          ? 'bg-cyber-amber/20 text-cyber-amber border-cyber-amber font-bold'
                          : 'bg-cyber-void text-zinc-400 border-cyber-border hover:text-zinc-200'
                      }`}>
                      <i className={`fa-solid ${tab.icon} text-[10px]`}></i>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* Modal Tab Content */}
                <div className="p-4 overflow-y-auto custom-scrollbar flex-1 text-xs leading-relaxed space-y-3 font-sans">
                  {guideTab === 'controls' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// CÁCH THAO TÁC 3 PHÍM BẤM TRÊN MORPH S3:</div>
                        <div>• <strong className="text-amber-400">Phím OK (GPIO 0 / BOOT):</strong> Nhấn 1 lần để CHỌN / ENTER. Nhấn giữ 2 giây để QUAY LẠI (BACK) hoặc mở menu ngữ cảnh.</div>
                        <div>• <strong className="text-cyan-400">Phím LÊN (GPIO 39):</strong> Di chuyển con trỏ lên trên / Tăng giá trị / Kênh tiếp theo.</div>
                        <div>• <strong className="text-cyan-400">Phím XUỐNG (GPIO 40):</strong> Di chuyển con trỏ xuống dưới / Giảm giá trị / Kênh trước đó.</div>
                      </div>
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-cyan font-bold">// CƠ CHẾ CẢM ỨNG ĐỘNG HỌC PROTOUCH:</div>
                        <div>• Vuốt lên / xuống để cuộn mượt mà có quán tính như smartphone.</div>
                        <div>• Chạm 1 chạm để chọn mục. Chạm giữ 1 giây trên màn hình để trở về màn hình chính.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'hardware' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// THÔNG SỐ PHẦN CỨNG MORPH S3 FLAGSHIP:</div>
                        <div>• <strong>MCU:</strong> ESP32-S3 N16R8 Dual-Core 240MHz (16MB Flash + 8MB Octal-PSRAM).</div>
                        <div>• <strong>Màn hình:</strong> ST7789 IPS 1.54 inch 240x240 góc nhìn rộng 178°.</div>
                        <div>• <strong>RF Sub-GHz:</strong> Mô-đun CC1101 (300-928 MHz) tích hợp bộ khuếch đại LNA.</div>
                        <div>• <strong>2.4GHz Sniffer:</strong> Mô-đun NRF24L01+ kết hợp ăng-ten rời SMA độ lợi cao.</div>
                        <div>• <strong>Thẻ nhớ:</strong> Khe MicroSD SPI hỗ trợ lưu log PCAP, từ điển mật khẩu và file cấu hình.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'webui' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-cyan font-bold">// KẾT NỐI VÀ CẤU HÌNH QUA GIAO DIỆN WEB:</div>
                        <div>1. Trên thiết bị Morph S3, vào menu <strong>Settings -> WebUI Server</strong> và bật ON.</div>
                        <div>2. Kết nối máy tính hoặc điện thoại vào điểm phát WiFi: <code className="text-amber-400">Morph-S3-AP</code> (Mật khẩu: <code className="text-amber-400">bruce1234</code>).</div>
                        <div>3. Mở trình duyệt web truy cập địa chỉ: <a href="http://192.168.4.1" target="_blank" className="text-cyan-400 underline font-bold">http://192.168.4.1</a>.</div>
                        <div>4. Tại đây bạn có thể cấu hình lại toàn bộ chân GPIO, đổi giao diện, tải file PCAP và cập nhật firmware qua OTA.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'flash' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// HƯỚNG DẪN NẠP FIRMWARE NHANH CHO MORPH S3:</div>
                        <div>1. Cắm cáp USB-C nối Morph S3 vào máy tính.</div>
                        <div>2. Bấm nút <strong>"KẾT NỐI THIẾT BỊ"</strong> ở góc trái và chọn đúng cổng COM.</div>
                        <div>3. Nếu máy không nhận cổng, giữ phím <strong>BOOT (GPIO 0)</strong> trong lúc cắm cáp USB để vào chế độ Bootloader ROM.</div>
                        <div>4. Bấm <strong>"BẮT ĐẦU GHI FIRMWARE"</strong> và chờ thanh tiến trình chạy đủ 100%.</div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-3 border-t border-cyber-border bg-cyber-void flex justify-between items-center">
                  <button
                    onClick={() => {
                      setSelectedBoardId('Morph-s3');
                      setShowMorphGuide(false);
                      playHackerSfx('blip', sfxEnabled);
                    }}
                    className="px-3 py-1.5 rounded bg-cyber-green text-cyber-void font-extrabold text-xs flex items-center gap-1.5 hover:bg-cyber-green/90">
                    <i className="fa-solid fa-check"></i>
                    <span>{t.morphSelectNow}</span>
                  </button>

                  <button
                    onClick={() => setShowMorphGuide(false)}
                    className="px-3 py-1.5 rounded border border-cyber-border bg-cyber-surface text-zinc-400 hover:text-white text-xs">
                    {t.morphCloseBtn}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

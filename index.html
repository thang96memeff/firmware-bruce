<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIRMWARE FLASHER</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zinc: { 850: '#1f2023', 900: '#18181b', 950: '#09090b' },
            accent: '#f59e0b', // Amber 500 cho công nghiệp
          },
          fontFamily: {
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
            sans: ['system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Icons & React/Babel -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- ESPTOOL Module Import (Phiên bản ổn định mới) -->
  <script type="module">
    import { Transport, ESPLoader } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.5.4/+esm';
    window.ESP_TOOLS = { Transport, ESPLoader };
  </script>
</head>
<body class="bg-zinc-950 text-zinc-300 font-sans antialiased m-0 p-0 h-screen overflow-hidden flex flex-col">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TRANSLATIONS = {
      en: {
        title: "SYS.FLASHER",
        subtitle: "Hardware Firmware Utility",
        connect: "Connect Device",
        disconnect: "Disconnect",
        baudRate: "Baud Rate",
        targetBoard: "Target Hardware",
        localFile: "Local Firmware (.bin)",
        noFile: "No file selected",
        eraseFlash: "Erase entire flash before writing",
        flashBtn: "WRITE FIRMWARE",
        flashing: "WRITING...",
        sysLogs: "System Log",
        devLogs: "Serial Monitor",
        clear: "Clear",
        startMonitor: "Start Monitor",
        stopMonitor: "Stop Monitor",
        waiting: "Waiting for device...",
        unsupported: "Web Serial API is not supported in this browser. Please use Chrome/Edge on Desktop.",
        adminSettings: "Advanced Settings",
        save: "Save Config",
        fwLink: "Firmware URL",
        logoUrl: "Logo URL",
        password: "Admin Password...",
        wrongPass: "Access Denied",
        unlock: "Unlock",
        cancel: "Cancel",
        errConnect: "Connection failed",
        errFile: "No firmware file to flash",
        success: "FIRMWARE WRITTEN SUCCESSFULLY",
        disconnected: "Device disconnected",
        chipDetected: "Chip detected",
        erasing: "Erasing flash memory...",
        done: "Done."
      },
      vi: {
        title: "SYS.FLASHER",
        subtitle: "Công cụ Nạp Firmware",
        connect: "Kết Nối Thiết Bị",
        disconnect: "Ngắt Kết Nối",
        baudRate: "Tốc Độ Baud",
        targetBoard: "Bo Mạch Đích (Board)",
        localFile: "File Firmware (.bin)",
        noFile: "Chưa chọn file",
        eraseFlash: "Xóa toàn bộ Flash (Erase All) trước khi nạp",
        flashBtn: "NẠP FIRMWARE",
        flashing: "ĐANG NẠP...",
        sysLogs: "Log Hệ Thống",
        devLogs: "Serial Monitor",
        clear: "Xóa Log",
        startMonitor: "Mở Monitor",
        stopMonitor: "Dừng Monitor",
        waiting: "Đang chờ kết nối thiết bị...",
        unsupported: "Trình duyệt không hỗ trợ Web Serial. Vui lòng dùng Chrome/Edge trên máy tính.",
        adminSettings: "Cấu Hình Nâng Cao",
        save: "Lưu Cấu Hình",
        fwLink: "Link Firmware (.bin)",
        logoUrl: "Link Logo",
        password: "Mật khẩu quản trị...",
        wrongPass: "Sai mật khẩu",
        unlock: "Mở Khóa",
        cancel: "Hủy",
        errConnect: "Lỗi kết nối thiết bị",
        errFile: "Lỗi: Chưa có file Firmware",
        success: "NẠP FIRMWARE THÀNH CÔNG",
        disconnected: "Đã ngắt kết nối",
        chipDetected: "Đã nhận diện Chip",
        erasing: "Đang xóa bộ nhớ flash...",
        done: "Hoàn tất."
      }
    };

    const ADMIN_HASH = "bb84f53ce294e2c3a185586e1414a48e76f85bd594c0879a57ae8f9af8e8a903";
    const GITHUB_BASE = "https://thang96memeff.github.io/firmware-bruce/";

    const INITIAL_BOARDS = [
      { id: 'CYD-2432S028', name: 'CYD-2432S028', chip: 'ESP32', url: 'Bruce-CYD-2432S028.bin' },
      { id: 'lilygo-t-display-ttgo', name: 'Lilygo T-Display TTGO', chip: 'ESP32', url: 'Bruce-lilygo-t-display-ttgo.bin' },
      { id: 'lilygo-t-embed-cc1101', name: 'Lilygo T-Embed CC1101', chip: 'ESP32-S3', url: 'Bruce-lilygo-t-embed-cc1101.bin' },
      { id: 'lilygo-t-display-s3', name: 'Lilygo T-Display-S3', chip: 'ESP32-S3', url: 'Bruce-lilygo-t-display-s3.bin' },
      { id: 'xingzhi-cube-s3', name: 'Xingzhi Cube', chip: 'ESP32-S3', url: 'Bruce-xingzhi-cube-s3.bin' },
      { id: 'smoochiee-board', name: 'Smoochiee Board', chip: 'ESP32', url: 'Bruce-smoochiee-board.bin' },
      { id: 'custom-board', name: 'Custom Board / Auto', chip: 'Any', url: '' },
    ];

    function App() {
      const [lang, setLang] = useState('vi');
      const t = (key) => TRANSLATIONS[lang][key] || key;

      const [isSupported, setIsSupported] = useState(true);
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      const [eraseFlash, setEraseFlash] = useState(false);

      const [boards, setBoards] = useState(INITIAL_BOARDS);
      const [boardId, setBoardId] = useState(INITIAL_BOARDS[0].id);
      const [localFile, setLocalFile] = useState(null);
      const [logoUrl, setLogoUrl] = useState(GITHUB_BASE + "IMG_4498.jpeg");

      // Admin state
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdmin, setShowAdmin] = useState(false);
      const [adminPwd, setAdminPwd] = useState("");
      const [loginErr, setLoginErr] = useState(false);

      // Terminal state
      const [logTab, setLogTab] = useState('sys');
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);
      const [isMonitor, setIsMonitor] = useState(false);
      const [isFlashing, setIsFlashing] = useState(false);
      const [progress, setProgress] = useState(0);

      const termRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);

      useEffect(() => {
        if (!('serial' in navigator)) setIsSupported(false);
        const cfg = localStorage.getItem('morph_flash_config');
        if (cfg) {
          try {
            const parsed = JSON.parse(cfg);
            if (parsed.boards) setBoards(parsed.boards);
            if (parsed.logoUrl) setLogoUrl(parsed.logoUrl);
          } catch(e) {}
        }
      }, []);

      useEffect(() => {
        if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
      }, [sysLogs, devLogs, logTab]);

      const logSys = (msg, type = 'info') => setSysLogs(p => [...p, { time: new Date().toLocaleTimeString('en-GB'), msg, type }]);
      const logDev = (msg) => setDevLogs(p => [...p, { time: new Date().toLocaleTimeString('en-GB'), msg }]);

      // --- SERIAL LOGIC ---
      const connectPort = async () => {
        try {
          if (!window.ESP_TOOLS) throw new Error("ESPTool library not loaded.");
          const port = await navigator.serial.requestPort();
          portRef.current = port;
          setIsConnected(true);
          logSys(`Port opened. Ready.`, 'success');
        } catch (err) {
          logSys(`${t('errConnect')}: ${err.message}`, 'error');
        }
      };

      const disconnectPort = async () => {
        await stopMonitor();
        portRef.current = null;
        setIsConnected(false);
        logSys(t('disconnected'), 'warning');
      };

      const startMonitor = async () => {
        try {
          if (!portRef.current) return;
          const transport = new window.ESP_TOOLS.Transport(portRef.current);
          transportRef.current = transport;
          await transport.connect(115200);
          setIsMonitor(true);
          setLogTab('dev');
          logSys(`Serial Monitor started (115200 baud).`, 'success');

          // Read loop
          while (transport.device.readable && setIsMonitor) {
            const reader = transport.device.readable.getReader();
            readerRef.current = reader;
            try {
              while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const lines = new TextDecoder().decode(value).split('\n');
                lines.forEach(l => { if (l.trim()) logDev(l.trim()); });
              }
            } catch (e) { break; } 
            finally { reader.releaseLock(); readerRef.current = null; }
          }
        } catch (err) {
          logSys(`Monitor error: ${err.message}`, 'error');
          setIsMonitor(false);
        }
      };

      const stopMonitor = async () => {
        if (readerRef.current) await readerRef.current.cancel().catch(()=>{});
        if (transportRef.current) {
          await transportRef.current.disconnect().catch(()=>{});
          transportRef.current = null;
        }
        setIsMonitor(false);
      };

      // --- FLASH LOGIC ---
      const handleFlash = async () => {
        const board = boards.find(b => b.id === boardId);
        if (!board?.url && !localFile) return logSys(t('errFile'), 'error');
        
        setIsFlashing(true);
        setProgress(0);
        setLogTab('sys');

        try {
          await stopMonitor();
          await new Promise(r => setTimeout(r, 300)); // Delay for port release

          let fwData;
          if (localFile) {
            logSys(`Reading local file: ${localFile.name}...`);
            fwData = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.onerror = rej;
              r.readAsBinaryString(localFile);
            });
          } else {
            logSys(`Downloading firmware: ${board.url}...`);
            const url = board.url.startsWith('http') ? board.url : GITHUB_BASE + board.url;
            const resp = await fetch(url + '?t=' + Date.now());
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const blob = await resp.blob();
            fwData = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.onerror = rej;
              r.readAsBinaryString(blob);
            });
          }

          logSys(`Connecting to bootloader at ${baudRate} baud...`);
          const transport = new window.ESP_TOOLS.Transport(portRef.current);
          const esploader = new window.ESP_TOOLS.ESPLoader({
            transport,
            baudrate: parseInt(baudRate),
            terminal: { clean: ()=>{}, writeLine: logSys, write: logSys }
          });

          await esploader.main();
          logSys(t('chipDetected'), 'success');

          await esploader.writeFlash({
            fileArray: [{ data: fwData, address: 0x0 }],
            flashSize: 'keep',
            eraseAll: eraseFlash,
            compress: true,
            reportProgress: (idx, written, total) => setProgress(Math.round((written/total)*100))
          });

          logSys(t('success'), 'success');
          await esploader.hardReset();
          await transport.disconnect().catch(()=>{});
        } catch (err) {
          logSys(`Flash Failed: ${err.message}`, 'error');
        } finally {
          setIsFlashing(false);
          setProgress(0);
        }
      };

      // --- ADMIN LOGIC ---
      const checkAdmin = async (e) => {
        e.preventDefault();
        setLoginErr(false);
        const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(adminPwd));
        const hashHex = Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
        if (hashHex === ADMIN_HASH) { setIsAdmin(true); setShowAdmin(false); setAdminPwd(""); } 
        else { setLoginErr(true); }
      };

      const saveAdmin = () => {
        localStorage.setItem('morph_flash_config', JSON.stringify({ boards, logoUrl }));
        setIsAdmin(false);
        logSys("Config saved locally.", "success");
      };

      // --- UI RENDER ---
      return (
        <div className="flex-1 flex flex-col min-h-0 bg-zinc-950 text-zinc-300">
          
          {/* Header */}
          <header className="flex items-center justify-between px-6 py-4 border-b border-zinc-800 bg-zinc-900 shrink-0">
            <div className="flex items-center gap-4">
              <div className="w-10 h-10 bg-zinc-800 rounded border border-zinc-700 flex items-center justify-center overflow-hidden">
                {logoUrl ? <img src={logoUrl} className="w-full h-full object-cover opacity-80" alt="logo" /> : <i className="fa-solid fa-microchip text-zinc-500"></i>}
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-widest text-zinc-100">{t('title')}</h1>
                <p className="text-xs text-zinc-500 uppercase tracking-wider">{t('subtitle')}</p>
              </div>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setLang(lang === 'en' ? 'vi' : 'en')} className="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-semibold border border-zinc-700 transition-colors">
                {lang.toUpperCase()}
              </button>
              <button onClick={() => isAdmin ? setIsAdmin(false) : setShowAdmin(true)} className={`px-3 py-1.5 rounded text-xs font-semibold border transition-colors ${isAdmin ? 'bg-amber-500/10 text-amber-500 border-amber-500/30' : 'bg-zinc-800 hover:bg-zinc-700 border-zinc-700'}`}>
                <i className="fa-solid fa-sliders"></i>
              </button>
            </div>
          </header>

          {!isSupported && (
            <div className="bg-rose-500/10 border-b border-rose-500/20 text-rose-400 px-6 py-3 text-sm font-medium flex items-center gap-3">
              <i className="fa-solid fa-triangle-exclamation"></i> {t('unsupported')}
            </div>
          )}

          {/* Main Content Grid */}
          <main className="flex-1 overflow-hidden flex flex-col lg:flex-row">
            
            {/* LEFT: Control Panel */}
            <div className="w-full lg:w-[400px] border-r border-zinc-800 flex flex-col bg-zinc-900/30 overflow-y-auto custom-scrollbar">
              
              {isAdmin ? (
                <div className="p-6 space-y-5">
                  <div className="flex justify-between items-center border-b border-zinc-800 pb-3">
                    <h2 className="text-sm font-bold text-amber-500 uppercase tracking-wider">{t('adminSettings')}</h2>
                    <button onClick={saveAdmin} className="text-xs bg-amber-500 text-zinc-950 px-3 py-1.5 rounded font-bold hover:bg-amber-400">
                      {t('save')}
                    </button>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-zinc-500 mb-2 uppercase">{t('logoUrl')}</label>
                    <input type="text" value={logoUrl} onChange={e => setLogoUrl(e.target.value)} className="w-full bg-zinc-950 border border-zinc-800 rounded px-3 py-2 text-sm text-zinc-300 focus:border-amber-500 outline-none" />
                  </div>
                  <div className="space-y-3">
                    <label className="block text-xs font-semibold text-zinc-500 uppercase">{t('fwLink')}</label>
                    {boards.map(b => (
                      <div key={b.id} className="bg-zinc-950 border border-zinc-800 p-3 rounded flex flex-col gap-2">
                        <span className="text-xs font-bold text-zinc-300">{b.name}</span>
                        <input type="text" value={b.url} onChange={e => setBoards(boards.map(ob => ob.id === b.id ? {...ob, url: e.target.value} : ob))} placeholder="Firmware URL..." className="w-full bg-zinc-900 border border-zinc-800 rounded px-2 py-1 text-xs text-zinc-400 focus:border-amber-500 outline-none" />
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="p-6 space-y-6">
                  {/* Connection */}
                  <div className="space-y-3">
                    <label className="block text-xs font-semibold text-zinc-500 uppercase tracking-wider">1. Connection</label>
                    <div className="flex gap-2">
                      {!isConnected ? (
                        <button onClick={connectPort} disabled={!isSupported} className="flex-1 bg-zinc-100 hover:bg-white text-zinc-900 font-bold py-2 rounded text-sm transition-colors disabled:opacity-50">
                          {t('connect')}
                        </button>
                      ) : (
                        <button onClick={disconnectPort} disabled={isFlashing} className="flex-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700 font-bold py-2 rounded text-sm transition-colors disabled:opacity-50">
                          {t('disconnect')}
                        </button>
                      )}
                      <select value={baudRate} onChange={e => setBaudRate(e.target.value)} disabled={isFlashing} className="w-28 bg-zinc-950 border border-zinc-800 rounded px-2 text-xs font-mono text-zinc-300 outline-none focus:border-zinc-600 disabled:opacity-50">
                        <option value="115200">115200</option>
                        <option value="460800">460800</option>
                        <option value="921600">921600</option>
                        <option value="1500000">1500000</option>
                      </select>
                    </div>
                  </div>

                  {/* Firmware Selection */}
                  <div className="space-y-3 border-t border-zinc-800/50 pt-5">
                    <label className="block text-xs font-semibold text-zinc-500 uppercase tracking-wider">2. Firmware</label>
                    <select value={boardId} onChange={e => setBoardId(e.target.value)} disabled={isConnected || isFlashing} className="w-full bg-zinc-950 border border-zinc-800 rounded p-2.5 text-sm text-zinc-200 outline-none focus:border-zinc-600 disabled:opacity-50">
                      {boards.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                    </select>
                    
                    <div className="relative">
                      <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-zinc-800"></div></div>
                      <div className="relative flex justify-center"><span className="bg-zinc-900/30 px-2 text-[10px] text-zinc-600 uppercase">OR</span></div>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-zinc-400 mb-1">{t('localFile')}</label>
                      <input type="file" accept=".bin" onChange={e => setLocalFile(e.target.files[0])} disabled={isConnected || isFlashing} className="block w-full text-xs text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-300 hover:file:bg-zinc-700 cursor-pointer border border-zinc-800 rounded p-1 disabled:opacity-50 bg-zinc-950" />
                    </div>
                  </div>

                  {/* Options & Action */}
                  <div className="space-y-4 border-t border-zinc-800/50 pt-5">
                    <label className="flex items-center gap-2 cursor-pointer">
                      <input type="checkbox" checked={eraseFlash} onChange={e => setEraseFlash(e.target.checked)} disabled={isFlashing} className="w-4 h-4 rounded border-zinc-700 bg-zinc-900 text-amber-500 focus:ring-amber-500/50 focus:ring-offset-0 disabled:opacity-50" />
                      <span className="text-xs text-zinc-400">{t('eraseFlash')}</span>
                    </label>

                    <button onClick={handleFlash} disabled={!isConnected || isFlashing || (!boards.find(b=>b.id===boardId)?.url && !localFile)} className={`w-full relative overflow-hidden font-bold py-3.5 rounded transition-all duration-300 text-sm tracking-wide ${(!isConnected || isFlashing || (!boards.find(b=>b.id===boardId)?.url && !localFile)) ? 'bg-zinc-800 text-zinc-600 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-[0_0_15px_rgba(5,150,105,0.2)]'}`}>
                      {isFlashing ? `${t('flashing')} ${progress}%` : t('flashBtn')}
                      {isFlashing && <div className="absolute left-0 bottom-0 top-0 bg-black/20" style={{ width: `${progress}%` }} />}
                    </button>
                  </div>
                </div>
              )}
            </div>

            {/* RIGHT: Console / Monitor */}
            <div className="flex-1 flex flex-col bg-[#0c0c0e]">
              <div className="flex items-center justify-between px-4 border-b border-zinc-800 bg-zinc-900/50 shrink-0">
                <div className="flex gap-4">
                  <button onClick={() => setLogTab('sys')} className={`py-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors ${logTab === 'sys' ? 'text-zinc-100 border-amber-500' : 'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t('sysLogs')}</button>
                  <button onClick={() => setLogTab('dev')} className={`py-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors ${logTab === 'dev' ? 'text-zinc-100 border-amber-500' : 'text-zinc-500 border-transparent hover:text-zinc-300'}`}>{t('devLogs')}</button>
                </div>
                <div className="flex items-center gap-2">
                  {logTab === 'dev' && (
                    <button onClick={isMonitor ? stopMonitor : startMonitor} disabled={!isConnected || isFlashing} className={`px-3 py-1.5 rounded border text-xs font-semibold transition-colors disabled:opacity-50 ${isMonitor ? 'bg-rose-500/10 text-rose-500 border-rose-500/30 hover:bg-rose-500/20' : 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:bg-zinc-700'}`}>
                      <i className={`fa-solid ${isMonitor ? 'fa-stop' : 'fa-play'} mr-1.5`}></i>{isMonitor ? t('stopMonitor') : t('startMonitor')}
                    </button>
                  )}
                  <button onClick={() => logTab === 'sys' ? setSysLogs([]) : setDevLogs([])} className="p-1.5 text-zinc-500 hover:text-zinc-300 transition-colors" title={t('clear')}>
                    <i className="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </div>
              
              <div ref={termRef} className="flex-1 p-4 overflow-y-auto font-mono text-[11px] leading-relaxed custom-scrollbar break-all text-zinc-300 select-text">
                {(logTab === 'sys' ? sysLogs : devLogs).length === 0 ? (
                  <div className="text-zinc-600 italic mt-2">{t('waiting')}</div>
                ) : (
                  (logTab === 'sys' ? sysLogs : devLogs).map((l, i) => (
                    <div key={i} className="flex gap-3 mb-1">
                      <span className="text-zinc-600 shrink-0 select-none">[{l.time}]</span>
                      <span className={`${l.type === 'error' ? 'text-rose-400' : l.type === 'success' ? 'text-emerald-400' : l.type === 'warning' ? 'text-amber-400' : 'text-zinc-300'}`}>{l.msg}</span>
                    </div>
                  ))
                )}
              </div>
            </div>

          </main>

          {/* Admin Unlock Modal */}
          {showAdmin && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
              <div className="bg-zinc-900 border border-zinc-800 rounded-lg p-6 w-full max-w-sm shadow-2xl">
                <h3 className="text-sm font-bold text-zinc-100 uppercase tracking-widest mb-4">Auth Required</h3>
                <form onSubmit={checkAdmin}>
                  <input type="password" autoFocus placeholder={t('password')} value={adminPwd} onChange={e => {setAdminPwd(e.target.value); setLoginErr(false);}} className={`w-full bg-zinc-950 border rounded px-3 py-2.5 text-sm outline-none text-zinc-200 transition-colors ${loginErr ? 'border-rose-500' : 'border-zinc-700 focus:border-amber-500'}`} />
                  {loginErr && <p className="text-rose-500 text-[10px] uppercase font-bold mt-2">{t('wrongPass')}</p>}
                  <div className="flex gap-2 mt-5">
                    <button type="button" onClick={() => setShowAdmin(false)} className="flex-1 py-2 rounded border border-zinc-700 text-zinc-400 text-xs font-bold hover:bg-zinc-800">{t('cancel')}</button>
                    <button type="submit" className="flex-1 py-2 rounded bg-amber-500 text-zinc-950 text-xs font-bold hover:bg-amber-400">{t('unlock')}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          <style dangerouslySetInnerHTML={{__html: `
            .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
            .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
          `}} />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

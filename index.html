  <script type="module">
    import { Transport, ESPLoader, bstrToUi8 } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.7.0/+esm';

    const toModuleUint8Array = (input) => {
      if (!input) return new Uint8Array(0);
      if (input instanceof Uint8Array) {
        return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
      }
      if (input instanceof ArrayBuffer) {
        return new Uint8Array(input);
      }
      if (input.buffer && input.buffer instanceof ArrayBuffer) {
        return new Uint8Array(input.buffer, input.byteOffset || 0, input.byteLength || input.buffer.byteLength);
      }
      if (typeof input === 'string') {
        return bstrToUi8 ? bstrToUi8(input) : new TextEncoder().encode(input);
      }
      return new Uint8Array(input);
    };

    const origWriteFlash = ESPLoader.prototype.writeFlash;
    ESPLoader.prototype.writeFlash = async function(options) {
      if (options && Array.isArray(options.fileArray)) {
        for (let i = 0; i < options.fileArray.length; i++) {
          const item = options.fileArray[i];
          if (item && item.data !== undefined) {
            item.data = toModuleUint8Array(item.data);
          }
        }
      }
      return await origWriteFlash.call(this, options);
    };

    window.ESP_TOOLS = {
      Transport,
      ESPLoader,
      bstrToUi8,
      toUint8Array: toModuleUint8Array
    };
    window.dispatchEvent(new Event('esptool_ready'));
  </script>

        // ============================================================================

    function App() {
      // Tự động nhận diện phiên bản Bruce mới nhất từ GitHub
      const [liveBruceVersion, setLiveBruceVersion] = useState("v1.17.2");
      useEffect(() => {
        fetch("https://raw.githubusercontent.com/thang96memeff/bruce-duscu/main/platformio.ini")
          .then(r => r.text())
          .then(txt => {
            const m = txt.match(/BRUCE_VERSION=['"]([^'"]+)['"]/);
            if (m) {
              setLiveBruceVersion("v" + m[1]);
              console.log("[VERSION] Tự động nhận diện phiên bản Bruce mới nhất: v" + m[1]);
            }
          }).catch(e => {});
      }, []);

      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      const [eraseFlash, setEraseFlash] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [mobileView, setMobileView] = useState('control'); // 'control' | 'log' | 'sodo'
      
      const [selectedBoardId, setSelectedBoardId] = useState('Morph-s3');
      const [localFile, setLocalFile] = useState(null);
      const [flashOffset, setFlashOffset] = useState('0x0000');
      
      // Mặc định là 'aqua' (Sóng Đại Dương)

      // GitHub live detection
      const [githubFiles, setGithubFiles] = useState({});
      const [isFetchingGithub, setIsFetchingGithub] = useState(false);
      const [logoUrl] = useState("IMG_4498.jpeg");

      // Chip info
      const [chipInfo, setChipInfo] = useState(null);

      // Flash & Terminal state
      const [isFlashing, setIsFlashing] = useState(false);
      const [isErasingOnly, setIsErasingOnly] = useState(false);
      const [progress, setProgress] = useState(0);
      const [logTab, setLogTab] = useState('sodo');
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);
      const [isMonitor, setIsMonitor] = useState(false);
      const [monitorBaud, setMonitorBaud] = useState(115200);
      const [serialInput, setSerialInput] = useState('');

      // Sơ đồ chân state
      const [sodoData, setSodoData] = useState(null);
      const [isLoadingSodo, setIsLoadingSodo] = useState(false);
      const [sodoError, setSodoError] = useState(null);

      // Morph S3 User Manual Modal State
      const [showMorphGuide, setShowMorphGuide] = useState(false);
      const [guideTab, setGuideTab] = useState('controls');

      // Quản lý Ngôn ngữ
      const [lang, setLang] = useState(() => {

      const toggleLang = () => {

      const cycleWaterTheme = () => {

      };

      // Refs cho thanh trượt Tab (Sliding Pill Indicator)
      const tabContainerRef = useRef(null);
      const tabRefs = {
        sodo: useRef(null),
        sys: useRef(null),
        dev: useRef(null)
      };
      const [pillStyle, setPillStyle] = useState({ left: 4, width: 120 });

      useEffect(() => {
        const updatePill = () => {
          const activeEl = tabRefs[logTab]?.current;
          const containerEl = tabContainerRef.current;
          if (activeEl && containerEl) {
            const cRect = containerEl.getBoundingClientRect();
            const aRect = activeEl.getBoundingClientRect();
            setPillStyle({
              left: aRect.left - cRect.left,

            });

      }, [logTab, lang]);

      const termRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const activeTransportRef = useRef(null);
      const isMonitorRef = useRef(false);
      const logTabRef = useRef(logTab);
      useEffect(() => { logTabRef.current = logTab; }, [logTab]);
      const monitorBaudRef = useRef(monitorBaud);
      useEffect(() => { monitorBaudRef.current = monitorBaud; }, [monitorBaud]);

      const loadSodo = async (boardId) => {
        if (!boardId) return;
        setIsLoadingSodo(true);
        setSodoError(null);
        setSodoData(null);

        const boardObj = MASTER_BOARDS.find(b => b.id === boardId);
        const candidates = [
          boardId,
          boardId.toLowerCase(),
          boardObj?.url ? boardObj.url.replace(/^Bruce-/, '').replace(/\.bin$/, '') : null
        ].filter(Boolean);
        const uniqueCandidates = [...new Set(candidates)];

        let loaded = null;
        for (const cand of uniqueCandidates) {
          try {
            let res = await fetch(`./sodo/${cand}.json?t=${Date.now()}`);
            if (res.ok) { loaded = await res.json(); break; }
            res = await fetch(`${GITHUB_RAW_BASE}sodo/${cand}.json?t=${Date.now()}`);
            if (res.ok) { loaded = await res.json(); break; }
            res = await fetch(`https://raw.githubusercontent.com/thang96memeff/firmware-bruce/main/sodo/${cand}.json?t=${Date.now()}`);
            if (res.ok) { loaded = await res.json(); break; }
          } catch(e) {}
        }

        if (loaded) {
          setSodoData(loaded);
        } else {
          setSodoError(`sodo/${boardId}.json`);
        }
        setIsLoadingSodo(false);
      };

      useEffect(() => {
        loadSodo(selectedBoardId);
      }, [selectedBoardId]);

      const releaseAndClosePort = async (port) => {
        if (!port) return;
        if (activeTransportRef.current) {
          try { await activeTransportRef.current.disconnect(); } catch(e) {}
          activeTransportRef.current = null;
        }
        if (transportRef.current) {
          try { await transportRef.current.disconnect(); } catch(e) {}
          transportRef.current = null;
        }
        if (readerRef.current) {
          try { await readerRef.current.cancel(); } catch(e) {}
          try { readerRef.current.releaseLock(); } catch(e) {}
          readerRef.current = null;
        }
        try {
          if (port.readable || port.writable) {
            await port.close();
          }
        } catch(e) {}
      };

      const logSys = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg, type }]);
      };

      // Ghi log Serial theo thời gian thực (hỗ trợ cả chuỗi chưa có \n)
      const appendSerialChunk = (chunkText) => {
        if (!chunkText) return;
        const cleanText = chunkText.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '');
        const nowStr = new Date().toLocaleTimeString('en-GB');

        setDevLogs(prev => {
          const next = [...prev];
          const parts = cleanText.split(/\r?\n/);

          for (let i = 0; i < parts.length; i++) {
            const segment = parts[i];
            if (i === 0 && next.length > 0 && next[next.length - 1].partial) {
              next[next.length - 1] = {
                ...next[next.length - 1],
                msg: next[next.length - 1].msg + segment,
                partial: (parts.length === 1)
              };
            } else {
              if (segment.length > 0 || i < parts.length - 1) {
                if (segment.length > 0) {
                  next.push({
                    time: nowStr,
                    msg: segment,
                    partial: (i === parts.length - 1)
                  });
                }
              }
            }
          }
          return next.slice(-1000);
        });
      };

      const fetchGithubContents = async () => {
        setIsFetchingGithub(true);
        try {
          const res = await fetch(GITHUB_API_URL + '?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (res.ok) {
            const data = await res.json();
            const map = {};
            if (Array.isArray(data)) {
              data.forEach(item => {
                if (item.name && item.name.endsWith('.bin')) {
                  map[item.name] = {
                    size: item.size,
                    download_url: item.download_url,
                    html_url: item.html_url
                  };
                }
              });
            }
            setGithubFiles(map);
            logSys(t.logSyncSuccess(Object.keys(map).length), 'success');
          } else {
            throw new Error(`HTTP ${res.status}`);
          }
        } catch (e) {
          logSys(t.logSyncWarn(e.message), 'warning');
        } finally {
          setIsFetchingGithub(false);
        }
      };

      useEffect(() => {
        logSys(t.logInit, "info");
        fetchGithubContents();
      }, []);

      useEffect(() => {
        const handleUsbDisconnect = (e) => {
          if (portRef.current && e.target && e.target !== portRef.current) return;
          logSys("[USB] Thiết bị đã ngắt kết nối.", "warning");
          isMonitorRef.current = false;
          setIsMonitor(false);
          if (readerRef.current) {
            try { readerRef.current.cancel(); } catch(err) {}
            try { readerRef.current.releaseLock(); } catch(err) {}
            readerRef.current = null;
          }
          portRef.current = null;
          setIsConnected(false);
          setChipInfo(null);
        };

        const handleUsbConnect = () => {
          logSys("[USB] Phát hiện thiết bị USB mới. Bấm 'Kết nối Cổng USB' hoặc 'Mở Monitor' để chọn cổng.", "info");
        };

        if ('serial' in navigator) {
          navigator.serial.addEventListener('disconnect', handleUsbDisconnect);
          navigator.serial.addEventListener('connect', handleUsbConnect);
          return () => {
            navigator.serial.removeEventListener('disconnect', handleUsbDisconnect);
            navigator.serial.removeEventListener('connect', handleUsbConnect);
          };
        }
      }, []);

      useEffect(() => {
        if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
      }, [sysLogs, devLogs, logTab]);

      // =========================================================================
      // FIX 1: LUÔN HIỆN BẢNG CHỌN CỔNG COM (requestPort) KHI CHƯA KẾT NỐI
      // Tuyệt đối không dùng getPorts() tự đoán cổng cũ gây lỗi Failed to open serial port
      // =========================================================================
      const requestUserSerialPort = async (forcePopup = false) => {
        if (!('serial' in navigator)) {
          throw new Error(t.logNoWebSerial);
        }
        let port = portRef.current;
        if (!port || forcePopup) {
          port = await navigator.serial.requestPort();
        }
        if (port) {
          portRef.current = port;
          setIsConnected(true);
          const info = port.getInfo ? port.getInfo() : {};
          const vid = info.usbVendorId ? `0x${info.usbVendorId.toString(16).toUpperCase().padStart(4, '0')}` : null;
          const pid = info.usbProductId ? `0x${info.usbProductId.toString(16).toUpperCase().padStart(4, '0')}` : null;
          const isEspNative = info.usbVendorId === 0x303A;
          if (vid && pid) {
            setChipInfo({
              chip: isEspNative ? 'ESP32 Native USB' : 'USB-UART Bridge',
              mac: `${vid}:${pid}`
            });
          }
        }
        return port;
      };

      // =========================================================================
      // FIX 2: NÚT TO "KẾT NỐI CỔNG USB" KHÔNG BAO GIỜ ĐẨY MẠCH VÀO BOOTLOADER
      // Nếu đang ở tab Serial Monitor, tự động mở luôn luồng đọc Serial!
      // =========================================================================
      const connectPort = async () => {
        try {
          const port = await requestUserSerialPort(true);
          if (!port) return;

          logSys(t.logPortSuccess, "success");

          // Nếu người dùng đang đứng ở tab Serial Monitor -> Mở luôn Serial Monitor, không chuyển tab!
          if (logTabRef.current === 'dev') {
            await startMonitor(port);
          } else if (logTabRef.current === 'sodo') {
            setLogTab('sys');
          }
        } catch (err) {
          logSys(t.logPortErr(err.message), "error");
        }
      };

      const disconnectPort = async () => {
        await stopMonitor();
        if (portRef.current) {
          await releaseAndClosePort(portRef.current);
          portRef.current = null;
        }
        setIsConnected(false);
        setChipInfo(null);
        logSys(t.logPortDisconnect, "warning");
      };

      // =========================================================================
      // FIX 3: SERIAL MONITOR MỞ CỔNG AN TOÀN, CHỐNG LỖI FAILED TO OPEN SERIAL PORT
      // =========================================================================
      const startMonitor = async (customPort = null) => {
        if (isFlashing || isErasingOnly) return;
        try {
          // Nếu chưa chọn cổng COM nào, lập tức hiện bảng chọn cổng COM của trình duyệt
          let port = customPort || portRef.current;
          if (!port) {
            port = await requestUserSerialPort(true);
          }
          if (!port) return;

          // Giải phóng reader cũ nếu đang chạy
          if (isMonitorRef.current || readerRef.current) {
            isMonitorRef.current = false;
            if (readerRef.current) {
              try { await readerRef.current.cancel(); } catch(e) {}
              try { readerRef.current.releaseLock(); } catch(e) {}
              readerRef.current = null;
            }
          }

          const baud = parseInt(monitorBaudRef.current) || 115200;

          // Kiểm tra nếu cổng chưa mở thì mở, nếu đã mở ở phiên trước thì đóng sạch rồi mở lại
          if (port.readable || port.writable) {
            await releaseAndClosePort(port);
            await new Promise(r => setTimeout(r, 150));
          }

          try {
            await port.open({ baudRate: baud, bufferSize: 16384 });
          } catch (openErr) {
            // Nếu hệ điều hành vẫn báo cổng đang bận hoặc không mở được, cho phép chọn lại cổng ngay
            logSys(`[WARN] Cổng đang bận hoặc đã đổi số COM (${openErr.message}). Vui lòng chọn lại cổng COM...`, 'warning');
            portRef.current = null;
            port = await requestUserSerialPort(true);
            if (!port) return;
            await releaseAndClosePort(port);
            await new Promise(r => setTimeout(r, 150));
            await port.open({ baudRate: baud, bufferSize: 16384 });
          }

          // Thiết lập tín hiệu DTR/RTS chuẩn để KHÔNG vào Bootloader
          const info = port.getInfo ? port.getInfo() : {};
          const isEspNativeUsb = info.usbVendorId === 0x303A;

          try {
            if (isEspNativeUsb) {
              // ESP32-S3 / C3 / C5 USB gốc: DTR = true, RTS = false để nhận dữ liệu USB CDC mà không reset vào Bootloader
              await port.setSignals({ dataTerminalReady: true, requestToSend: false });
            } else {
              // Chip UART CH340 / CP2102: DTR = false, RTS = false để chân EN=HIGH, IO0=HIGH
              await port.setSignals({ dataTerminalReady: false, requestToSend: false });
            }
          } catch(sigErr) {}

          isMonitorRef.current = true;
          setIsMonitor(true);
          setLogTab('dev');
          logSys(t.logMonitorStart(baud, isEspNativeUsb ? 'Native USB CDC' : 'UART Normal Mode'), 'success');

          const decoder = new TextDecoder('utf-8', { fatal: false });

          while (isMonitorRef.current && port.readable) {
            try {
              const reader = port.readable.getReader();
              readerRef.current = reader;

              while (isMonitorRef.current) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value && value.length > 0) {
                  const textChunk = decoder.decode(value, { stream: true });
                  appendSerialChunk(textChunk);
                }
              }
            } catch (readErr) {
              if (isMonitorRef.current) {
                await new Promise(r => setTimeout(r, 80));
              }
            } finally {
              if (readerRef.current) {
                try { readerRef.current.releaseLock(); } catch(e) {}
                readerRef.current = null;
              }
            }
          }
        } catch (err) {
          logSys(t.logMonitorErr(err.message), 'error');
          isMonitorRef.current = false;
          setIsMonitor(false);
        }
      };

      const stopMonitor = async () => {
        isMonitorRef.current = false;
        setIsMonitor(false);
        if (readerRef.current) {
          try { await readerRef.current.cancel(); } catch(e) {}
          try { readerRef.current.releaseLock(); } catch(e) {}
          readerRef.current = null;
        }
        if (transportRef.current) {
          try { await transportRef.current.disconnect(); } catch(e) {}
          transportRef.current = null;
          activeTransportRef.current = null;
        }
        if (portRef.current) {
          await releaseAndClosePort(portRef.current);
        }
      };

      // Nút Reset Mạch về chế độ chạy Firmware bình thường (Normal Run Mode)
      const resetBoardFromMonitor = async () => {
        try {
          let port = portRef.current;
          if (!port) {
            port = await requestUserSerialPort(true);
          }
          if (!port) return;

          if (!isMonitorRef.current || !port.readable) {
            await startMonitor(port);
          }

          const info = port.getInfo ? port.getInfo() : {};
          const isEspNativeUsb = info.usbVendorId === 0x303A;

          // Kéo chân EN xuống thấp (DTR=false, RTS=true) trong 100ms để khởi động lại vào Firmware chính
          await port.setSignals({ dataTerminalReady: false, requestToSend: true });
          await new Promise(r => setTimeout(r, 100));
          if (isEspNativeUsb) {
            await port.setSignals({ dataTerminalReady: true, requestToSend: false });
          } else {
            await port.setSignals({ dataTerminalReady: false, requestToSend: false });
          }
          logSys(t.logResetPulse, 'info');
        } catch (e) {
          logSys(`[WARN] Reset: ${e.message}`, 'warning');
        }
      };

      // Gửi lệnh từ ô Input xuống thiết bị qua Serial TX
      const sendSerialCommand = async (e) => {
        e.preventDefault();
        if (!serialInput.trim()) return;
        try {
          let port = portRef.current;
          if (!port) {
            port = await requestUserSerialPort(true);
          }
          if (!port) return;

          if (!isMonitorRef.current || !port.writable) {
            await startMonitor(port);
          }
          if (port.writable) {
            const writer = port.writable.getWriter();
            const payload = new TextEncoder().encode(serialInput + '\r\n');
            await writer.write(payload);
            writer.releaseLock();
            appendSerialChunk(`\n> ${serialInput}\n`);
            setSerialInput('');
          }
        } catch (err) {
          logSys(`[ERR] TX: ${err.message}`, 'error');
        }
      };

      const handleEraseOnly = async () => {
        if (!isConnected || !portRef.current) return;
        if (!confirm(t.eraseConfirm)) return;

        setIsErasingOnly(true);
        setLogTab('sys');
        logSys(t.logEraseStart, "warning");

        let eraseTransport = null;
        try {
          await stopMonitor();
          await releaseAndClosePort(portRef.current);
          await new Promise(r => setTimeout(r, 200));

          eraseTransport = new window.ESP_TOOLS.Transport(portRef.current);
          activeTransportRef.current = eraseTransport;
          const esploader = new window.ESP_TOOLS.ESPLoader({
            transport: eraseTransport,
            baudrate: parseInt(baudRate),
            terminal: { clean: ()=>{}, writeLine: (msg)=>logSys(msg, 'info'), write: (msg)=>logSys(msg, 'info') }
          });
          await esploader.main();
          const chipDesc = `${esploader.chip.CHIP_NAME || 'ESP-Device'}`;
          const macStr = esploader.macAddr ? esploader.macAddr().map(b => b.toString(16).padStart(2,'0')).join(':').toUpperCase() : 'N/A';
          setChipInfo({ chip: chipDesc, mac: macStr });

          logSys(t.logEraseExec, "info");
          await esploader.eraseFlash();
          logSys(t.logEraseSuccess, "success");
          try {
            if (typeof esploader.after === 'function') await esploader.after("hard_reset");
            else if (typeof esploader.hardReset === 'function') await esploader.hardReset();
          } catch(e) {}
        } catch (err) {
          logSys(t.logEraseFail(err.message), "error");
        } finally {
          if (eraseTransport) {
            try { await eraseTransport.disconnect(); } catch(e) {}
            eraseTransport = null;
            activeTransportRef.current = null;
          }
          await releaseAndClosePort(portRef.current);
          setIsErasingOnly(false);
        }
      };

      const handleFlash = async () => {
        const board = MASTER_BOARDS.find(b => b.id === selectedBoardId);

        if (!localFile && !board?.url) {
          return logSys(t.logNoTarget, "error");
        }
        if (!portRef.current) {
          return logSys(t.logPortErr("Chưa kết nối cổng USB!"), "error");
        }

        setIsFlashing(true);
        setProgress(0);
        setMobileView('log');
        setLogTab('sys');

        let flashTransport = null;
        try {
          await stopMonitor();
          await releaseAndClosePort(portRef.current);
          await new Promise(r => setTimeout(r, 200));

          let fwData = null;
          if (localFile) {
            logSys(t.logLocalFile(localFile.name, (localFile.size / 1048576).toFixed(2)), "info");
            const buf = await localFile.arrayBuffer();
            fwData = window.ESP_TOOLS?.toUint8Array ? window.ESP_TOOLS.toUint8Array(buf) : new Uint8Array(buf);
          } else if (window.isAndroidApp && window.AndroidDownloader) {
            const remoteFile = board.url;
            logSys(`[ANDROID-OTG] Tự động tải ${remoteFile} qua 5 mirror CDN...`, "info");
            const buf = await window.AndroidDownloader.fetchFirmwareBuffer(board.id, remoteFile, (pct, r, t) => {
              logSys(`[DOWNLOAD] Đang tải firmware: ${pct}% (${(r/1048576).toFixed(2)}/${(t/1048576).toFixed(2)} MB)`, "info");
            });
            logSys(`[STORAGE] Đã đưa firmware vào RAM và TỰ ĐỘNG XÓA SẠCH file đệm trên máy! 🧹✨`, "success");
            fwData = window.ESP_TOOLS?.toUint8Array ? window.ESP_TOOLS.toUint8Array(buf) : new Uint8Array(buf);
          } else {
            const remoteFile = board.url;
            logSys(t.logFetching(remoteFile), "info");
            const fetchUrl = GITHUB_RAW_BASE + remoteFile + '?t=' + Date.now();
            let resp = await fetch(fetchUrl);
            if (!resp.ok) {
              if (githubFiles[remoteFile]?.download_url) {
                resp = await fetch(githubFiles[remoteFile].download_url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
              } else {
                throw new Error(t.logFetchFail(remoteFile));
              }
            }
            const buf = await resp.arrayBuffer();
            fwData = window.ESP_TOOLS?.toUint8Array ? window.ESP_TOOLS.toUint8Array(buf) : new Uint8Array(buf);
          }

          if (!fwData || (fwData.length === 0 && fwData.byteLength === 0)) {
            throw new Error("Dữ liệu firmware trống hoặc không hợp lệ.");
          }

          const isBw16 = (board && (board.category === 'bw16' || board.chip === 'RTL8720DN')) || selectedBoardId.startsWith('bw16');

          if (isBw16) {
            logSys(`[BW16] Bắt đầu quy trình nạp chuyên biệt cho Realtek Ameba D RTL8720DN...`, "info");
            logSys(`[BW16] Nguồn firmware: ${board ? board.url : localFile?.name} (${(fwData.length/1024).toFixed(1)} KB)`, "info");
            logSys(`[BW16] Hướng dẫn: Đảm bảo module đã vào Download Mode (Giữ BURN -> Bấm RST -> Thả BURN)!`, "warn");

            if (!portRef.current.readable || !portRef.current.writable) {
              await portRef.current.open({ baudRate: parseInt(baudRate) || 115200 });
            }

            try {
              await portRef.current.setSignals({ dataTerminalReady: true, requestToSend: false });
              await new Promise(r => setTimeout(r, 100));
              await portRef.current.setSignals({ dataTerminalReady: false, requestToSend: true });
              await new Promise(r => setTimeout(r, 100));
              await portRef.current.setSignals({ dataTerminalReady: false, requestToSend: false });
            } catch(e) {}

            logSys(`[BW16] Đang kết nối UART và truyền nạp các khối dữ liệu vào Flash...`, "info");
            const writer = portRef.current.writable.getWriter();
            try {
              const CHUNK_SIZE = 1024;
              const totalChunks = Math.ceil(fwData.length / CHUNK_SIZE);
              for (let i = 0; i < totalChunks; i++) {
                const start = i * CHUNK_SIZE;
                const end = Math.min(start + CHUNK_SIZE, fwData.length);
                const chunk = fwData.slice(start, end);
                await writer.write(chunk);
                const pct = Math.round(((i + 1) / totalChunks) * 100);
                setProgress(pct);
                if (i % 25 === 0 || i === totalChunks - 1) {
                  logSys(`[BW16-WRITE] Đang ghi Flash: block ${i + 1}/${totalChunks} (${pct}%)...`, "info");
                }
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 5));
              }
            } finally {
              writer.releaseLock();
            }

            logSys("----------------------------------------", "success");
            logSys(`[OK] Nạp Firmware BW16 thành công 100%! (${fwData.length} bytes)`, "success");
            logSys(`[BW16] Hãy nhấn nút RST trên bo mạch BW16 để thiết bị khởi động lại.`, "success");
            logSys("----------------------------------------", "success");
            return;
          }

          logSys(t.logSyncBootloader(baudRate), "info");
          flashTransport = new window.ESP_TOOLS.Transport(portRef.current);
          activeTransportRef.current = flashTransport;

          const esploader = new window.ESP_TOOLS.ESPLoader({
            transport: flashTransport,
            baudrate: parseInt(baudRate),
            terminal: { clean: ()=>{}, writeLine: (msg) => logSys(msg, 'info'), write: (msg) => logSys(msg, 'info') }
          });

          await esploader.main();
          const chipDesc = `${esploader.chip.CHIP_NAME || 'ESP-Device'}`;
          const macStr = esploader.macAddr ? esploader.macAddr().map(b => b.toString(16).padStart(2,'0')).join(':').toUpperCase() : 'N/A';
          setChipInfo({ chip: chipDesc, mac: macStr });
          logSys(`[READY] Bootloader connected! Phát hiện vi xử lý: ${chipDesc} | MAC: ${macStr}`, "success");
          
          // Tự động nhận diện dòng chip và khớp danh mục bo mạch theo phong cách ESP32_FLASHTOOL_ANDROID
          if (chipDesc.includes("ESP32-S3") || chipDesc.includes("S3")) {
            setSelectedCategory("s3");
            logSys(`[AUTO-DETECT] Tự động chọn danh mục ESP32-S3 tương thích thiết bị.`, "info");
          } else if (chipDesc.includes("ESP32-C5") || chipDesc.includes("C5")) {
            setSelectedCategory("c5");
            logSys(`[AUTO-DETECT] Tự động chọn danh mục ESP32-C5 tương thích thiết bị.`, "info");
          } else if (chipDesc.includes("ESP32-C3") || chipDesc.includes("C3")) {
            setSelectedCategory("c3");
            logSys(`[AUTO-DETECT] Tự động chọn danh mục ESP32-C3 tương thích thiết bị.`, "info");
          } else if (chipDesc.includes("ESP32")) {
            setSelectedCategory("esp32");
            logSys(`[AUTO-DETECT] Tự động chọn danh mục ESP32 Classic tương thích thiết bị.`, "info");
          }

          const writeOffset = parseInt(flashOffset, 16) || 0x0;
          logSys(t.logWriteFlash(writeOffset.toString(16).toUpperCase(), eraseFlash), "info");

          await esploader.writeFlash({
            fileArray: [{ data: fwData, address: writeOffset }],
            flashSize: 'keep',
            eraseAll: eraseFlash,
            compress: true,
            reportProgress: (fileIdx, written, total) => {
              const pct = Math.round((written / total) * 100);
              setProgress(pct);
            }
          });

          logSys("----------------------------------------", "success");
          logSys(t.logFlashSuccess, "success");
          logSys(t.logReboot, "info");
          logSys("----------------------------------------", "success");

          try {
            if (typeof esploader.after === 'function') await esploader.after("hard_reset");
            else if (typeof esploader.hardReset === 'function') await esploader.hardReset();
          } catch(e) {}

          try {
            await portRef.current.setSignals({ dataTerminalReady: false, requestToSend: true });
            await new Promise(r => setTimeout(r, 100));
            await portRef.current.setSignals({ dataTerminalReady: false, requestToSend: false });
          } catch(e) {}

        } catch (err) {
          logSys(t.logFlashFail(err.message), "error");
        } finally {
          if (flashTransport) {
            try { await flashTransport.disconnect(); } catch(e) {}
            flashTransport = null;
            activeTransportRef.current = null;
          }
          await releaseAndClosePort(portRef.current);
          setIsFlashing(false);
          setProgress(0);
        }
      };

      const filteredBoards = useMemo(() => {
        if (selectedCategory === 'all') return MASTER_BOARDS.filter(b => !b.isHero);
        return MASTER_BOARDS.filter(b => b.category === selectedCategory && !b.isHero);

                  </h1>

              </div>
            </div>

            {/* Cụm nút Pill Bo Tròn Nổi 3D trên Header */}

                title="Bruce DUSCU Firmware v1.17.2 - Phiên bản mới nhất"

                <span className="relative flex h-2 w-2">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></span>
                </span>
                <i className="fa-solid fa-code-branch text-emerald-600 text-[11px] group-hover:rotate-12 transition-transform"></i>
                <span className="font-extrabold tracking-wide bg-gradient-to-r from-emerald-700 to-teal-800 bg-clip-text text-transparent">{liveBruceVersion}</span>

              <button

              <button

              <button

                {lang.toUpperCase()}

            </div>
          </header>

          {/* THANH ĐIỀU HƯỚNG NHANH TRÊN ĐIỆN THOẠI (Mobile Navigation Switcher) */}
          <div className="flex lg:hidden items-center justify-between p-1 rounded-full bg-white/30 backdrop-blur-md border border-white/70 mx-3 mb-2 shrink-0 shadow-sm">
            <button
              type="button"
              onClick={() => setMobileView('control')}

                mobileView === 'control'

            <button

              className={`flex-1 py-1.5 px-2 rounded-full text-xs font-bold transition-all flex items-center justify-center gap-1.5 relative ${
                mobileView === 'log'
                  ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-sm'

            <button

          {/* KHÔNG GIAN LÀM VIỆC CHÍNH (2 CỘT KÍNH TRONG SUỐT) */}

            {/* CỘT TRÁI: BẢNG ĐIỀU KHIỂN NẠP FIRMWARE (445px) */}

              {/* THẺ 1: KẾT NỐI THIẾT BỊ (HIỆU ỨNG KÍNH MỜ XUYÊN THẤU) */}

              {/* THẺ 2: BO MẠCH ĐÍCH (HIỆU ỨNG KÍNH MỜ XUYÊN THẤU) */}

                            l.type === 'error' ? 'text-rose-700 font-bold' : 
                            l.type === 'success' ? 'text-emerald-800 font-bold' : 
                            l.type === 'warning' ? 'text-amber-800 font-semibold' : 
                            'text-slate-900 font-medium'
                          }`}>
                            {l.msg}
                          </span>
                        </div>
                      ))
                    )}
                  </div>

                  {/* Thanh nhập lệnh Serial TX (chỉ hiện trong tab Serial Monitor) */}
                  {logTab === 'dev' && (
                    <form onSubmit={sendSerialCommand} className="p-3 border-t border-white/45 bg-white/20 flex gap-2">
                      <input
                        type="text"
                        value={serialInput}
                        onChange={e => setSerialInput(e.target.value)}
                        placeholder={t.txPlaceholder}
                        className="flex-1 liquid-input px-4 py-2 text-xs font-mono text-slate-900 placeholder-slate-500 outline-none rounded-full"
                      />
                      <button
                        type="submit"
                        className="liquid-btn-primary px-5 py-2 text-xs flex items-center gap-1.5">
                        <i className="fa-solid fa-paper-plane text-[10px]"></i>
                        <span>{t.sendBtn}</span>
                      </button>
                    </form>
                  )}
                </div>
              )}

              {/* Thanh trạng thái dưới cùng */}
              <div className="px-5 py-2.5 border-t border-white/45 bg-white/20 flex items-center justify-between text-xs text-slate-700 font-medium">
                <div className="flex items-center gap-2.5">
                  <span className="flex items-center gap-1.5 font-semibold">
                    <span className={`w-2 h-2 rounded-full ${isConnected ? 'bg-emerald-500' : 'bg-slate-400'}`}></span>
                    <span>{isConnected ? t.portOnline : t.portOffline}</span>
                  </span>
                  {chipInfo && <span className="text-slate-800 font-mono">• {chipInfo.chip} [{chipInfo.mac}]</span>}
                </div>
                <div className="font-mono text-[11px] text-slate-600">ESPLoader v0.7.0</div>
              </div>

            </div>

          </main>

          {/* MODAL CẨM NANG MORPH S3 */}
          {showMorphGuide && (
            <div className="fixed inset-0 z-50 bg-slate-900/20 backdrop-blur-md flex items-center justify-center p-3 sm:p-4 select-text">
              <div className="liquid-shell rounded-[32px] max-w-2xl w-full max-h-[88vh] flex flex-col overflow-hidden shadow-2xl bg-white/45">
                
                {/* Modal Header */}
                <div className="p-4 sm:p-5 border-b border-white/60 bg-white/35 flex items-center justify-between gap-3">
                  <div className="flex items-center gap-3 min-w-0">
                    <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center text-base shrink-0 shadow-md">
                      <i className="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div className="min-w-0">
                      <h2 className="text-sm sm:text-base font-extrabold text-slate-900 truncate">
                        {t.morphGuideTitle}
                      </h2>
                      <p className="text-xs text-slate-700 truncate">
                        {t.morphGuideSub}
                      </p>
                    </div>
                  </div>

                  <button 
                    onClick={() => setShowMorphGuide(false)}
                    className="liquid-btn w-9 h-9 flex items-center justify-center text-slate-800 shrink-0">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                {/* Modal Tab Bar */}
                <div className="flex border-b border-white/60 bg-white/25 px-4 py-2 gap-1.5 overflow-x-auto custom-scrollbar shrink-0">
                  {[
                    { id: 'controls', label: t.morphTabControls, icon: 'fa-gamepad' },
                    { id: 'hardware', label: t.morphTabHardware, icon: 'fa-microchip' },
                    { id: 'webui',    label: t.morphTabWebui,    icon: 'fa-wifi' },
                    { id: 'flash',    label: t.morphTabFlash,    icon: 'fa-bolt' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setGuideTab(tab.id)}
                      className={`px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1.5 ${
                        guideTab === tab.id 
                          ? 'bg-blue-600 text-white shadow-sm' 
                          : 'bg-white/45 text-slate-800 hover:bg-white/75'
                      }`}>
                      <i className={`fa-solid ${tab.icon} text-[11px]`}></i>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* Modal Body */}
                <div key={guideTab} className="tab-pane-animate flex-1 overflow-y-auto p-5 space-y-3.5 text-xs text-slate-800 custom-scrollbar leading-relaxed">
                  {guideTab === 'controls' && (
                    <div className="space-y-3">
                      <div className="liquid-card p-4">
                        <div className="font-extrabold text-blue-800 mb-2 text-sm">
                          1. Chế độ 3 Phím Tiêu chuẩn
                        </div>
                        <ul className="space-y-1.5 list-disc list-inside">
                          <li><b>UP (GPIO 16):</b> Di chuyển lên trên / Giảm giá trị.</li>
                          <li><b>DOWN (GPIO 13):</b> Di chuyển xuống dưới / Tăng giá trị.</li>
                          <li><b>OK (GPIO 0):</b> Nhấn 1 lần để Chọn (Enter). Nhấn giữ &gt; 1.2s để Thoát (Back).</li>
                        </ul>
                      </div>

                      <div className="liquid-card p-4">
                        <div className="font-extrabold text-indigo-800 mb-2 text-sm">
                          2. Chế độ 2 Phím & Con lăn (Rotary Encoder)
                        </div>
                        <ul className="space-y-1.5 list-disc list-inside">
                          <li><b>Nút Next (GPIO 13):</b> Nhấn 1 lần: Tới. Nhấp đúp hoặc Giữ: Chọn (OK).</li>
                          <li><b>Nút Prev (GPIO 16):</b> Nhấn 1 lần: Lùi. Nhấp đúp hoặc Giữ: Thoát (ESC).</li>
                          <li><b>Rotary Encoder:</b> Xoay để cuộn menu mượt mà, nhấn nút giữa để xác nhận.</li>
                        </ul>
                      </div>
                    </div>
                  )}

                  {guideTab === 'hardware' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="liquid-card p-3.5">
                        <div className="font-bold text-blue-800 mb-1">Vi xử lý & Bộ nhớ</div>
                        <p>ESP32-S3 Dual-Core LX7 @ 240MHz</p>
                        <p className="font-semibold text-emerald-800">16MB Flash • 8MB Octal-PSRAM</p>
                      </div>
                      <div className="liquid-card p-3.5">
                        <div className="font-bold text-blue-800 mb-1">Màn hình ST7789 IPS</div>
                        <p>240x240px SPI (MOSI:10, SCLK:9, CS:14, DC:8, RST:18, BL:13)</p>
                      </div>
                      <div className="liquid-card p-3.5">
                        <div className="font-bold text-blue-800 mb-1">CC1101 Sub-GHz</div>
                        <p>Dải tần 300-928MHz (SS:2, GDO0:1, MOSI:48, MISO:41, SCK:47)</p>
                      </div>
                      <div className="liquid-card p-3.5">
                        <div className="font-bold text-blue-800 mb-1">NRF24L01+ & MicroSD</div>
                        <p>NRF24 (CE:4, SS:21) • Thẻ nhớ MicroSD (CS:42)</p>
                      </div>
                    </div>
                  )}

                  {guideTab === 'webui' && (
                    <div className="liquid-card p-4 space-y-2.5">
                      <div className="font-extrabold text-blue-800 text-sm">
                        Cấu hình chân & màn hình qua Wi-Fi không cần nạp lại code
                      </div>
                      <ol className="space-y-2 list-decimal list-inside">
                        <li>Nạp firmware <b>Bruce-Morph-s3.bin</b> từ trình duyệt này.</li>
                        <li>Kết nối vào Wi-Fi tên <b>Morph-Config</b> (Không mật khẩu).</li>
                        <li>Mở trình duyệt truy cập <b>http://192.168.4.1</b> để đổi chân phím, xoay màn hình, gán chân module.</li>
                        <li>Bấm <b>Save &amp; Reboot</b> để lưu cấu hình vĩnh viễn vào bộ nhớ Flash.</li>
                      </ol>
                    </div>
                  )}

                  {guideTab === 'flash' && (
                    <div className="liquid-card p-4 space-y-2">
                      <div className="font-extrabold text-emerald-800 text-sm">
                        Các bước nạp Firmware nhanh
                      </div>
                      <ol className="space-y-1.5 list-decimal list-inside">
                        <li>Cắm cáp USB Type-C kết nối mạch với máy tính.</li>
                        <li>Nếu mạch chưa nhận cổng: Giữ nút <b>BOOT (GPIO 0)</b> rồi cắm cáp.</li>
                        <li>Bấm nút <b>{t.connectBtn}</b> và chọn cổng COM tương ứng.</li>
                        <li>Bật chọn <b>{t.eraseBefore}</b> nếu nạp lần đầu, sau đó bấm <b>{t.flashBtn}</b>.</li>
                      </ol>
                    </div>
                  )}
                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-white/60 bg-white/35 flex items-center justify-between">
                  <span className="text-xs font-semibold text-slate-700">Morph S3 Flagship</span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        setSelectedBoardId('Morph-s3');
                        setLocalFile(null);
                        setShowMorphGuide(false);
                      }}
                      className="liquid-btn-primary px-4 py-2 text-xs">
                      {t.morphSelectNow}
                    </button>
                    <button
                      onClick={() => setShowMorphGuide(false)}
                      className="liquid-btn px-4 py-2 text-xs">
                      {t.morphCloseBtn}
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

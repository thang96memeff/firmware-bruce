    // Web Audio Synthesizer cho SFX hacker retro
    const playHackerSfx = (type, enabled) => {
      if (!enabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'blip') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, now);
          osc.frequency.exponentialRampToValueAtTime(700, now + 0.025);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
          osc.start(now);
          osc.stop(now + 0.025);
        } else if (type === 'connect') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(1760, now + 0.07);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'flash') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'success') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.05);
          osc.frequency.setValueAtTime(783.99, now + 0.1);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch(e) {}
    };

    // Component Canvas Nền Động (Matrix Rain / Radar Grid)
    function CyberCanvas({ mode }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas || mode === 'off') return;
        const ctx = canvas.getContext('2d');
        let animationId;
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Matrix Rain
        const chars = "01ABCDEF0123456789BRUCEμΩλπ∑⚡⚔️📡";
        const fontSize = 12;
        const columns = Math.floor(width / fontSize);
        const drops = new Array(columns).fill(1).map(() => Math.floor(Math.random() * -60));

        // Radar particles
        let angle = 0;
        const particles = Array.from({ length: 40 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          size: Math.random() * 2 + 1
        }));

        const render = () => {
          if (mode === 'matrix') {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.14)';
            ctx.fillRect(0, 0, width, height);
            ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;

            for (let i = 0; i < drops.length; i++) {
              const text = chars[Math.floor(Math.random() * chars.length)];
              const x = i * fontSize;
              const y = drops[i] * fontSize;

              if (Math.random() > 0.88) {
                ctx.fillStyle = '#6ee7b7';
              } else {
                ctx.fillStyle = 'rgba(0, 255, 102, 0.35)';
              }
              ctx.fillText(text, x, y);

              if (y > height && Math.random() > 0.985) {
                drops[i] = 0;
              }
              drops[i]++;
            }
          } else if (mode === 'radar') {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.2)';
            ctx.fillRect(0, 0, width, height);

            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;
            const gridSize = 55;
            for (let x = 0; x < width; x += gridSize) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x, height);
              ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(width, y);
              ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0, 240, 255, 0.5)';
            particles.forEach((p, idx) => {
              p.x += p.vx;
              p.y += p.vy;
              if (p.x < 0) p.x = width;
              if (p.x > width) p.x = 0;
              if (p.y < 0) p.y = height;
              if (p.y > height) p.y = 0;

              ctx.beginPath();
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
              ctx.fill();

              for (let j = idx + 1; j < particles.length; j++) {
                const p2 = particles[j];
                const dist = Math.hypot(p.x - p2.x, p.y - p2.y);
                if (dist < 110) {
                  ctx.strokeStyle = `rgba(0, 240, 255, ${0.15 * (1 - dist / 110)})`;
                  ctx.beginPath();
                  ctx.moveTo(p.x, p.y);
                  ctx.lineTo(p2.x, p2.y);
                  ctx.stroke();
                }
              }
            });

            angle += 0.007;
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(width, height) * 0.42;
            const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
            grad.addColorStop(0, 'rgba(0, 255, 102, 0.04)');
            grad.addColorStop(1, 'transparent');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * radius, cy + Math.sin(angle) * radius);
            ctx.stroke();
          }

          animationId = requestAnimationFrame(render);
        };

        render();

        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationId);
        };
      }, [mode]);

      if (mode === 'off') return null;

      return (
        <canvas 
          ref={canvasRef} 
          className="fixed inset-0 pointer-events-none z-0 opacity-45 mix-blend-screen"
        />
      );
    }

    // Component Sơ đồ chân & Hướng dẫn nối dây chi tiết cho từng bo mạch (Tactical Blueprint)
    function PinoutViewer({ boardId, lang }) {
      const bData = BOARD_PINOUTS[boardId] || BOARD_PINOUTS['Morph-s3'];
      const isVi = (lang === 'vi');
      const [filter, setFilter] = useState('all');
      const [pinSearch, setPinSearch] = useState('');

      // Danh mục lọc tín hiệu
      const categories = useMemo(() => [
        { id: 'all', label: isVi ? 'TẤT CẢ LINH KIỆN' : 'ALL COMPONENTS', icon: 'fa-microchip' },
        { id: 'display', label: isVi ? 'MÀN HÌNH & CẢM ỨNG' : 'DISPLAY & TOUCH', icon: 'fa-tv' },
        { id: 'rf', label: isVi ? 'SUB-GHZ & NRF24' : 'RF SUB-GHZ / NRF24', icon: 'fa-tower-broadcast' },
        { id: 'storage', label: isVi ? 'THẺ NHỚ SD' : 'SD CARD', icon: 'fa-sd-card' },
        { id: 'controls', label: isVi ? 'PHÍM BẤM & ĐIỀU HƯỚNG' : 'BUTTONS & CONTROLS', icon: 'fa-gamepad' },
        { id: 'audio', label: isVi ? 'ÂM THANH & CÒI / MIC' : 'AUDIO & BUZZER', icon: 'fa-volume-high' },
        { id: 'io', label: isVi ? 'CỔNG GROVE & SERIAL' : 'GROVE & SERIAL I/O', icon: 'fa-network-wired' },
        { id: 'sensor', label: isVi ? 'CẢM BIẾN, PIN & HỒNG NGOẠI' : 'SENSORS, PMU & IR', icon: 'fa-battery-full' }
      ], [isVi]);

      // Lọc danh sách linh kiện theo danh mục & từ khóa tìm kiếm chân
      const filteredComponents = useMemo(() => {
        if (!bData || !bData.components) return [];
        return bData.components.filter(c => {
          let matchCat = (filter === 'all');
          if (!matchCat) {
            if (filter === 'rf') matchCat = (c.category === 'rf' || c.id.includes('cc1101') || c.id.includes('nrf24') || c.id.includes('lora'));
            else if (filter === 'display') matchCat = (c.category === 'display' || c.id.includes('touch'));
            else if (filter === 'storage') matchCat = (c.category === 'storage' || c.id.includes('sd'));
            else if (filter === 'controls') matchCat = (c.category === 'controls' || c.id.includes('button') || c.id.includes('keyboard') || c.id.includes('encoder') || c.id.includes('trackball'));
            else if (filter === 'audio') matchCat = (c.category === 'audio' || c.id.includes('mic') || c.id.includes('buzz'));
            else if (filter === 'io') matchCat = (c.category === 'io' || c.id.includes('grove') || c.id.includes('serial') || c.id.includes('qwiic'));
            else if (filter === 'sensor') matchCat = (c.category === 'sensor' || c.id.includes('power') || c.id.includes('pmu') || c.id.includes('ir') || c.id.includes('led') || c.id.includes('rtc'));
          }
          if (!matchCat) return false;

          if (!pinSearch.trim()) return true;
          const q = pinSearch.toLowerCase();
          const inCompName = c.name.toLowerCase().includes(q) || (c.info && c.info.toLowerCase().includes(q));
          const inPins = c.pins && c.pins.some(p => 
            p.code.toLowerCase().includes(q) || 
            p.real.toLowerCase().includes(q) || 
            p.gpio.toLowerCase().includes(q) || 
            p.wire.toLowerCase().includes(q) || 
            p.note.toLowerCase().includes(q)
          );
          return inCompName || inPins;
        });
      }, [bData, filter, pinSearch]);

      const totalPins = useMemo(() => {
        if (!bData || !bData.components) return 0;
        return bData.components.reduce((acc, c) => acc + (c.pins ? c.pins.length : 0), 0);
      }, [bData]);

      return (
        <div className="h-full flex flex-col overflow-y-auto custom-scrollbar p-3 sm:p-4 text-xs font-mono leading-relaxed select-text space-y-3.5 bg-cyber-void/80 blueprint-bg">
          
          {/* Header Card của Bo mạch */}
          <div className="bg-cyber-surface/90 border border-cyber-border rounded p-3 sm:p-4 shadow-xl relative overflow-hidden">
            <div className="absolute top-0 right-0 w-28 h-28 bg-gradient-to-bl from-cyber-cyan/10 to-transparent pointer-events-none"></div>
            
            <div className="flex flex-wrap items-center justify-between gap-2 pb-2.5 border-b border-cyber-border">
              <div className="flex items-center gap-2.5">
                <div className="w-2.5 h-2.5 bg-cyber-green pulse-tactical shadow-lg shadow-cyber-green/50"></div>
                <h3 className="text-sm font-bold text-zinc-100 tracking-wider glow-green">{bData.name}</h3>
              </div>
              <div className="flex flex-wrap items-center gap-1.5 text-[10px]">
                <span className="px-2 py-0.5 rounded bg-cyber-green/10 text-cyber-green border border-cyber-green/30 font-bold">{bData.chip}</span>
                <span className="px-2 py-0.5 rounded bg-cyber-cyan/10 text-cyber-cyan border border-cyber-cyan/30">{bData.type}</span>
                {bData.usb && <span className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700">{bData.usb}</span>}
                <span className="px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/30 font-bold">
                  {bData.components ? bData.components.length : 0} {isVi ? 'LINH KIỆN' : 'COMPS'} • {totalPins} {isVi ? 'CHÂN NỐI' : 'PINS'}
                </span>
              </div>
            </div>
            <p className="mt-2 text-zinc-400 text-xs font-sans leading-relaxed">{bData.desc}</p>
          </div>

          {/* Banner Lưu ý Ký hiệu Chân Ngoài Đời Thực */}
          <div className="bg-cyber-amber/10 border-l-2 border-cyber-amber border-y border-r border-cyber-amber/30 p-2.5 sm:p-3 rounded-r">
            <div className="flex items-center gap-2 text-cyber-amber font-bold text-[11px] mb-1.5 glow-amber">
              <i className="fa-solid fa-triangle-exclamation text-xs"></i>
              <span>{isVi ? "ĐỐI CHIẾU KÝ HIỆU CHÂN IN TRÊN MODULE THỰC TẾ (SILKSCREEN MAPPING)" : "REAL-WORLD HARDWARE SILKSCREEN PIN MAPPING"}</span>
            </div>
            <div className="text-zinc-300 text-[11px] space-y-1 font-sans">
              <div className="flex flex-wrap gap-x-4 gap-y-1">
                <span>• <strong className="text-cyber-amber">Màn hình SPI:</strong> Trong code ghi <code className="text-cyber-cyan bg-zinc-900 px-1 rounded">TFT_MOSI</code> in là <strong className="text-cyber-green font-mono">SDA / DIN / SDI</strong>; <code className="text-cyber-cyan bg-zinc-900 px-1 rounded">TFT_SCLK</code> in là <strong className="text-cyber-green font-mono">SCL / CLK</strong>; <code className="text-cyber-cyan bg-zinc-900 px-1 rounded">TFT_DC</code> in là <strong className="text-cyber-green font-mono">DC / RS</strong>; <code className="text-cyber-cyan bg-zinc-900 px-1 rounded">TFT_BL</code> in là <strong className="text-cyber-green font-mono">BLK / LED</strong>.</span>
                <span>• <strong className="text-cyber-amber">Mô-đun CC1101:</strong> Chân MOSI in là <strong className="text-cyber-green font-mono">SI (Serial In)</strong>; MISO in là <strong className="text-cyber-green font-mono">SO (Serial Out)</strong>; SCK in là <strong className="text-cyber-green font-mono">SCLK</strong>; SS in là <strong className="text-cyber-green font-mono">CSN / CS</strong>; Ngắt in là <strong className="text-cyber-green font-mono">GD0</strong>.</span>
                <span>• <strong className="text-cyber-amber">Mô-đun NRF24L01+:</strong> <span className="text-cyber-red font-bold font-mono">⚠️ BẮT BUỘC NGUỒN 3.3V</span> (Nối 5V sẽ cháy chip ngay!). Chân <strong className="text-cyber-green font-mono">CE</strong> và <strong className="text-cyber-green font-mono">CSN</strong> là 2 chân điều khiển riêng.</span>
              </div>
            </div>
          </div>

          {/* Thanh Tìm Kiếm Chân & Bộ Lọc Tín Hiệu */}
          <div className="space-y-2 pb-1">
            <div className="relative">
              <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-zinc-500 text-xs"></i>
              <input
                type="text"
                value={pinSearch}
                onChange={(e) => setPinSearch(e.target.value)}
                placeholder={isVi ? "Tra cứu chân nhanh (VD: 48, MOSI, SDA, GDO0, CE, TX, 3.3V, Reset)..." : "Search pins (e.g. 48, MOSI, SDA, GDO0, CE, TX, 3.3V)..."}
                className="w-full bg-cyber-surface/90 border border-cyber-border rounded pl-8 pr-8 py-1.5 text-xs text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-cyber-green/50 font-mono"
              />
              {pinSearch && (
                <button
                  onClick={() => setPinSearch('')}
                  className="absolute right-2.5 top-2 text-zinc-500 hover:text-zinc-300">
                  <i className="fa-solid fa-xmark text-xs"></i>
                </button>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-1.5 text-[10px]">
              <span className="text-zinc-500 mr-1">// BỘ LỌC LINH KIỆN:</span>
              {categories.map(c => (
                <button
                  key={c.id}
                  onClick={() => setFilter(c.id)}
                  className={`px-2 py-0.5 rounded border transition-colors flex items-center gap-1 uppercase ${
                    filter === c.id ? 'bg-cyber-green/20 text-cyber-green border-cyber-green/60 font-bold' : 'bg-cyber-surface text-zinc-400 border-cyber-border hover:text-zinc-200'
                  }`}>
                  <i className={`fa-solid ${c.icon} text-[9px]`}></i>
                  <span>{c.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* DANH SÁCH CHI TIẾT TỪNG LINH KIỆN & TOÀN BỘ CHÂN KẾT NỐI */}
          {filteredComponents.length > 0 ? (
            filteredComponents.map((c, cIdx) => {
              const quickWireSnippet = c.pins.map(p => `${p.real.split('/')[0].trim()}->${p.gpio.replace('GPIO ', 'IO')}`).join(' | ');

              return (
                <div key={c.id || cIdx} className="bg-cyber-surface/90 border border-cyber-border rounded overflow-hidden shadow-lg">
                  
                  {/* Tiêu đề Linh Kiện */}
                  <div className="bg-cyber-void px-3 py-2 border-b border-cyber-border flex flex-wrap items-center justify-between gap-2">
                    <span className="font-bold text-cyber-cyan flex items-center gap-2 glow-cyan text-xs">
                      <i className={`fa-solid ${c.icon || 'fa-microchip'} text-cyber-green text-xs`}></i>
                      <span>{c.name}</span>
                    </span>
                    <span className="text-[10px] text-zinc-400 font-sans bg-cyber-surface px-2 py-0.5 rounded border border-cyber-border/60">
                      {c.info}
                    </span>
                  </div>

                  {/* Bảng Chi Tiết Từng Chân Nối */}
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-[11px]">
                      <thead className="bg-cyber-surface text-zinc-500 border-b border-cyber-border text-[10px] uppercase">
                        <tr>
                          <th className="p-2 pl-3">TÊN TRONG CODE</th>
                          <th className="p-2 text-cyber-green">IN TRÊN MODULE THỰC TẾ</th>
                          <th className="p-2 text-cyber-cyan">CHÂN ESP (GPIO)</th>
                          <th className="p-2 text-zinc-200">SƠ ĐỒ ĐẤU DÂY (WIRE-TO-WIRE)</th>
                          <th className="p-2 pr-3 text-zinc-400 font-sans">GHI CHÚ KỸ THUẬT & ĐIỆN ÁP</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-cyber-border/40 font-mono">
                        {c.pins.map((p, pIdx) => (
                          <tr key={pIdx} className="hover:bg-cyber-card/70 transition-colors">
                            <td className="p-2 pl-3 text-cyan-400 font-semibold">{p.code}</td>
                            <td className="p-2 text-cyber-green font-bold bg-cyber-green/5">
                              <span className="px-1.5 py-0.5 rounded bg-cyber-green/10 border border-cyber-green/30">
                                {p.real}
                              </span>
                            </td>
                            <td className="p-2">
                              <span className="text-zinc-100 font-bold bg-zinc-800 px-1.5 py-0.5 rounded border border-zinc-700">
                                {p.gpio}
                              </span>
                            </td>
                            <td className="p-2 text-zinc-200 font-semibold">
                              <div className="flex items-center gap-1.5">
                                <i className="fa-solid fa-arrow-right text-[9px] text-cyber-green"></i>
                                <span>{p.wire}</span>
                              </div>
                            </td>
                            <td className="p-2 pr-3 text-zinc-400 font-sans text-[11px]">{p.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  {/* Thanh đấu nối nhanh dạng Code Terminal */}
                  <div className="bg-cyber-void/90 px-3 py-1.5 border-t border-cyber-border/50 text-[10px] text-zinc-500 flex items-center justify-between">
                    <div className="flex items-center gap-1.5 overflow-x-auto whitespace-nowrap custom-scrollbar">
                      <span className="text-cyber-green font-bold">// ĐẤU DÂY NHANH:</span>
                      <code className="text-zinc-300 font-mono">{quickWireSnippet}</code>
                    </div>
                    <span className="text-zinc-600 shrink-0 ml-2">({c.pins.length} chân)</span>
                  </div>

                </div>
              );
            })
          ) : (
            <div className="p-8 text-center text-zinc-500 bg-cyber-surface/60 border border-dashed border-cyber-border rounded">
              <i className="fa-solid fa-filter-circle-xmark text-2xl mb-2 text-zinc-600"></i>
              <p className="text-xs">Không tìm thấy linh kiện hoặc chân nào khớp với từ khóa "{pinSearch}".</p>
              <button
                onClick={() => { setFilter('all'); setPinSearch(''); }}
                className="mt-2 px-3 py-1 rounded bg-cyber-green/10 border border-cyber-green/30 text-cyber-green text-xs font-bold hover:bg-cyber-green/20">
                Hiển thị lại tất cả linh kiện
              </button>
            </div>
          )}

        </div>
      );
    }

    function App() {
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      const [eraseFlash, setEraseFlash] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      
      const [selectedBoardId, setSelectedBoardId] = useState('Morph-s3');
      const [localFile, setLocalFile] = useState(null);
      const [flashOffset, setFlashOffset] = useState('0x0000');
      
      // GitHub live detection
      const [githubFiles, setGithubFiles] = useState({});
      const [isFetchingGithub, setIsFetchingGithub] = useState(false);
      const [logoUrl, setLogoUrl] = useState(GITHUB_RAW_BASE + "IMG_4498.jpeg");

      // Chip info
      const [chipInfo, setChipInfo] = useState(null);

      // Flash & Terminal state
      const [isFlashing, setIsFlashing] = useState(false);
      const [isErasingOnly, setIsErasingOnly] = useState(false);
      const [progress, setProgress] = useState(0);
      const [logTab, setLogTab] = useState('pinout'); // Mặc định hiển thị sơ đồ chân khi chưa kết nối
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);
      const [isMonitor, setIsMonitor] = useState(false);
      const [monitorBaud, setMonitorBaud] = useState(115200);

      // Hacker Settings (Nền động, CRT Scanlines, SFX Audio)
      const [bgMode, setBgMode] = useState(() => localStorage.getItem('duscu_bg_mode') || 'matrix');
      const [crtEnabled, setCrtEnabled] = useState(() => localStorage.getItem('duscu_crt') !== 'false');
      const [sfxEnabled, setSfxEnabled] = useState(() => localStorage.getItem('duscu_sfx') === 'true');

      // Ticking UTC Clock
      const [utcTime, setUtcTime] = useState(new Date().toUTCString().replace("GMT", "UTC"));
      useEffect(() => {
        const timer = setInterval(() => {
          setUtcTime(new Date().toUTCString().replace("GMT", "UTC"));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Morph S3 User Manual Modal State
      const [showMorphGuide, setShowMorphGuide] = useState(false);
      const [guideTab, setGuideTab] = useState('controls');

      // Quản lý Ngôn ngữ
      const [lang, setLang] = useState(() => {
        const saved = localStorage.getItem('duscu_lang');
        if (saved === 'vi' || saved === 'en') return saved;
        return 'vi';
      });

      const t = I18N[lang] || I18N.vi;

      const toggleLang = () => {
        const nextLang = lang === 'vi' ? 'en' : 'vi';
        setLang(nextLang);
        localStorage.setItem('duscu_lang', nextLang);
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleBgMode = () => {
        const modes = ['matrix', 'radar', 'off'];
        const nextMode = modes[(modes.indexOf(bgMode) + 1) % modes.length];
        setBgMode(nextMode);
        localStorage.setItem('duscu_bg_mode', nextMode);
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleCrt = () => {
        const nextCrt = !crtEnabled;
        setCrtEnabled(nextCrt);
        localStorage.setItem('duscu_crt', String(nextCrt));
        playHackerSfx('blip', sfxEnabled);
      };

      const toggleSfx = () => {
        const nextSfx = !sfxEnabled;
        setSfxEnabled(nextSfx);
        localStorage.setItem('duscu_sfx', String(nextSfx));
        playHackerSfx('connect', nextSfx);
      };

      const termRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const activeTransportRef = useRef(null);
      const isMonitorRef = useRef(false);
      const autoResumeMonitorRef = useRef(false);
      const logTabRef = useRef(logTab);
      useEffect(() => { logTabRef.current = logTab; }, [logTab]);
      const monitorBaudRef = useRef(monitorBaud);
      useEffect(() => { monitorBaudRef.current = monitorBaud; }, [monitorBaud]);

      const releaseAndClosePort = async (port) => {
        if (!port) return;
        if (activeTransportRef.current) {
          try { await activeTransportRef.current.disconnect(); } catch(e) {}
          activeTransportRef.current = null;
        }
        if (transportRef.current) {
          try { await transportRef.current.disconnect(); } catch(e) {}
          transportRef.current = null;
        }
        if (readerRef.current) {
          try { await readerRef.current.cancel(); } catch(e) {}
          try { readerRef.current.releaseLock(); } catch(e) {}
          readerRef.current = null;
        }
        try {
          if (port.readable || port.writable) {
            await port.close();
          }
        } catch(e) {}
      };

      const logSys = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg, type }]);
      };
      const logDev = (msg) => {
        setDevLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg }]);
      };

      const fetchGithubContents = async () => {
        setIsFetchingGithub(true);
        playHackerSfx('blip', sfxEnabled);
        try {
          const res = await fetch(GITHUB_API_URL + '?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (res.ok) {
            const data = await res.json();
            const map = {};
            if (Array.isArray(data)) {
              data.forEach(item => {
                if (item.name && item.name.endsWith('.bin')) {
                  map[item.name] = { size: item.size, download_url: item.download_url };
                }
              });
            }
            setGithubFiles(map);
            logSys(`[SYNC] Đã đồng bộ ${Object.keys(map).length} file firmware từ GitHub repository.`, 'success');
            playHackerSfx('success', sfxEnabled);
          } else {
            logSys(`[WARN] GitHub API: Sử dụng danh mục mặc định (${res.status})`, 'warning');
          }
        } catch(e) {
          logSys(`[WARN] GitHub API: ${e.message}`, 'warning');
        } finally {
          setIsFetchingGithub(false);
        }
      };

      useEffect(() => {
        fetchGithubContents();
      }, []);

      const connectSerial = async () => {
        if (!navigator.serial) {
          alert("Trình duyệt không hỗ trợ Web Serial API. Vui lòng mở bằng Google Chrome hoặc MS Edge trên PC.");
          return;
        }
        playHackerSfx('blip', sfxEnabled);
        try {
          const port = await navigator.serial.requestPort();
          await releaseAndClosePort(port);
          portRef.current = port;
          setIsConnected(true);
          setLogTab('sys');
          logSys("[PORT] Đã kết nối cổng COM thành công.", 'success');
          playHackerSfx('connect', sfxEnabled);
        } catch (err) {
          if (err.name !== 'NotFoundError') {
            logSys(`[ERR] Lỗi kết nối cổng: ${err.message}`, 'error');
          }
        }
      };

      const disconnectSerial = async () => {
        playHackerSfx('blip', sfxEnabled);
        if (isMonitor) await stopMonitor(true);
        await releaseAndClosePort(portRef.current);
        portRef.current = null;
        setIsConnected(false);
        setChipInfo(null);
        logSys("[PORT] Đã ngắt kết nối cổng COM.", 'warning');
      };

      const handleFlash = async () => {
        if (!isConnected || !portRef.current) {
          alert("Vui lòng kết nối thiết bị trước khi nạp!");
          return;
        }
        const targetBoard = MASTER_BOARDS.find(b => b.id === selectedBoardId);
        if (!localFile && !targetBoard) {
          alert("Chưa chọn bo mạch đích hoặc file firmware .bin!");
          return;
        }

        playHackerSfx('flash', sfxEnabled);
        setIsFlashing(true);
        setLogTab('sys');
        setProgress(0);

        try {
          let binData;
          if (localFile) {
            logSys(`[FILE] Nạp file cục bộ: ${localFile.name} [${(localFile.size / 1024 / 1024).toFixed(2)} MB]`, 'info');
            binData = await localFile.arrayBuffer();
          } else {
            logSys(`[FETCH] Đang tải firmware: ${targetBoard.url}...`, 'info');
            const res = await fetch(GITHUB_RAW_BASE + targetBoard.url + '?t=' + Date.now());
            if (!res.ok) throw new Error(`Không tìm thấy file firmware ${targetBoard.url}`);
            binData = await res.arrayBuffer();
          }

          const { Transport, ESPLoader, toUint8Array } = window.ESP_TOOLS;
          const transport = new Transport(portRef.current, true);
          transportRef.current = transport;

          const esploader = new ESPLoader({
            transport,
            baudrate: parseInt(baudRate),
            terminal: {
              clean: () => {},
              writeLine: (data) => logSys(data),
              write: (data) => logSys(data)
            }
          });

          logSys(`[SYNC] Đồng bộ bootloader @ ${baudRate} baud...`, 'info');
          await esploader.main();
          setChipInfo({ chip: esploader.chip ? esploader.chip.CHIP_NAME : 'ESP32 Device', mac: 'CONNECTED' });

          const addr = parseInt(flashOffset, 16) || 0x0;
          logSys(`[WRITE] Ghi bộ nhớ tại địa chỉ 0x${flashOffset} ${eraseFlash ? '(Xóa toàn bộ Flash)' : ''}...`, 'info');

          const fileArray = [{ data: toUint8Array(binData), address: addr }];
          await esploader.writeFlash({
            fileArray,
            flashSize: 'keep',
            eraseAll: eraseFlash,
            compress: true,
            reportProgress: (fileIndex, written, total) => {
              const p = Math.round((written / total) * 100);
              setProgress(p);
            }
          });

          logSys("[SUCCESS] GHI FIRMWARE HOÀN TẤT THÀNH CÔNG 100%.", 'success');
          playHackerSfx('success', sfxEnabled);
          logSys("[REBOOT] Đang khởi động lại thiết bị...", 'info');
          await esploader.hardReset();
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } catch(err) {
          logSys(`[FAIL] Ghi Firmware thất bại: ${err.message}`, 'error');
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } finally {
          setIsFlashing(false);
        }
      };

      const handleErase = async () => {
        if (!isConnected || !portRef.current) return;
        if (!confirm(t.eraseConfirm)) return;

        playHackerSfx('flash', sfxEnabled);
        setIsErasingOnly(true);
        setLogTab('sys');

        try {
          const { Transport, ESPLoader } = window.ESP_TOOLS;
          const transport = new Transport(portRef.current, true);
          transportRef.current = transport;

          const esploader = new ESPLoader({
            transport,
            baudrate: parseInt(baudRate),
            terminal: {
              clean: () => {},
              writeLine: (data) => logSys(data),
              write: (data) => logSys(data)
            }
          });

          logSys("[CMD] Bắt đầu xóa sạch toàn bộ Flash chip...", 'warning');
          await esploader.main();
          await esploader.eraseFlash();
          logSys("[SUCCESS] ĐÃ XÓA SẠCH TOÀN BỘ CHIP FLASH THÀNH CÔNG.", 'success');
          playHackerSfx('success', sfxEnabled);
          await esploader.hardReset();
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } catch(err) {
          logSys(`[FAIL] Lỗi xóa Flash: ${err.message}`, 'error');
          await releaseAndClosePort(portRef.current);
          setIsConnected(false);
        } finally {
          setIsErasingOnly(false);
        }
      };

      const startMonitor = async () => {
        if (!portRef.current) return;
        playHackerSfx('blip', sfxEnabled);
        try {
          if (portRef.current.readable || portRef.current.writable) {
            await releaseAndClosePort(portRef.current);
          }
          await portRef.current.open({ baudRate: parseInt(monitorBaud) });
          setIsMonitor(true);
          isMonitorRef.current = true;
          logDev(`[MONITOR] Bắt đầu đọc Serial @ ${monitorBaud} baud.`);
          readLoop();
        } catch(err) {
          logSys(`[ERR] Serial Monitor: ${err.message}`, 'error');
        }
      };

      const stopMonitor = async (manual = false) => {
        isMonitorRef.current = false;
        setIsMonitor(false);
        playHackerSfx('blip', sfxEnabled);
        await releaseAndClosePort(portRef.current);
      };

      const readLoop = async () => {
        while (portRef.current && portRef.current.readable && isMonitorRef.current) {
          try {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = portRef.current.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            readerRef.current = reader;

            while (true) {
              const { value, done } = await reader.read();
              if (done) break;
              if (value) {
                const lines = value.split('\n');
                lines.forEach(line => {
                  if (line.trim()) logDev(line.replace(/\r/g, ''));
                });
              }
            }

                    { id: 'controls', label: t.morphTabControls, icon: 'fa-gamepad' },
                    { id: 'hardware', label: t.morphTabHardware, icon: 'fa-microchip' },
                    { id: 'webui', label: t.morphTabWebui, icon: 'fa-globe' },
                    { id: 'flash', label: t.morphTabFlash, icon: 'fa-bolt' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setGuideTab(tab.id)}
                      className={`px-3 py-1 rounded border transition-colors flex items-center gap-1.5 ${
                        guideTab === tab.id
                          ? 'bg-cyber-amber/20 text-cyber-amber border-cyber-amber font-bold'
                          : 'bg-cyber-void text-zinc-400 border-cyber-border hover:text-zinc-200'
                      }`}>
                      <i className={`fa-solid ${tab.icon} text-[10px]`}></i>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* Modal Tab Content */}
                <div className="p-4 overflow-y-auto custom-scrollbar flex-1 text-xs leading-relaxed space-y-3 font-sans">
                  {guideTab === 'controls' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// CÁCH THAO TÁC 3 PHÍM BẤM TRÊN MORPH S3:</div>
                        <div>• <strong className="text-amber-400">Phím OK (GPIO 0 / BOOT):</strong> Nhấn 1 lần để CHỌN / ENTER. Nhấn giữ 2 giây để QUAY LẠI (BACK) hoặc mở menu ngữ cảnh.</div>
                        <div>• <strong className="text-cyan-400">Phím LÊN (GPIO 39):</strong> Di chuyển con trỏ lên trên / Tăng giá trị / Kênh tiếp theo.</div>
                        <div>• <strong className="text-cyan-400">Phím XUỐNG (GPIO 40):</strong> Di chuyển con trỏ xuống dưới / Giảm giá trị / Kênh trước đó.</div>
                      </div>
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-cyan font-bold">// CƠ CHẾ CẢM ỨNG ĐỘNG HỌC PROTOUCH:</div>
                        <div>• Vuốt lên / xuống để cuộn mượt mà có quán tính như smartphone.</div>
                        <div>• Chạm 1 chạm để chọn mục. Chạm giữ 1 giây trên màn hình để trở về màn hình chính.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'hardware' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// THÔNG SỐ PHẦN CỨNG MORPH S3 FLAGSHIP:</div>
                        <div>• <strong>MCU:</strong> ESP32-S3 N16R8 Dual-Core 240MHz (16MB Flash + 8MB Octal-PSRAM).</div>
                        <div>• <strong>Màn hình:</strong> ST7789 IPS 1.54 inch 240x240 góc nhìn rộng 178°.</div>
                        <div>• <strong>RF Sub-GHz:</strong> Mô-đun CC1101 (300-928 MHz) tích hợp bộ khuếch đại LNA.</div>
                        <div>• <strong>2.4GHz Sniffer:</strong> Mô-đun NRF24L01+ kết hợp ăng-ten rời SMA độ lợi cao.</div>
                        <div>• <strong>Thẻ nhớ:</strong> Khe MicroSD SPI hỗ trợ lưu log PCAP, từ điển mật khẩu và file cấu hình.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'webui' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-cyan font-bold">// KẾT NỐI VÀ CẤU HÌNH QUA GIAO DIỆN WEB:</div>
                        <div>1. Trên thiết bị Morph S3, vào menu <strong>Settings -> WebUI Server</strong> và bật ON.</div>
                        <div>2. Kết nối máy tính hoặc điện thoại vào điểm phát WiFi: <code className="text-amber-400">Morph-S3-AP</code> (Mật khẩu: <code className="text-amber-400">bruce1234</code>).</div>
                        <div>3. Mở trình duyệt web truy cập địa chỉ: <a href="http://192.168.4.1" target="_blank" className="text-cyan-400 underline font-bold">http://192.168.4.1</a>.</div>
                        <div>4. Tại đây bạn có thể cấu hình lại toàn bộ chân GPIO, đổi giao diện, tải file PCAP và cập nhật firmware qua OTA.</div>
                      </div>
                    </div>
                  )}

                  {guideTab === 'flash' && (
                    <div className="space-y-3">
                      <div className="p-3 bg-cyber-void border border-cyber-border rounded font-mono text-[11px] space-y-1.5">
                        <div className="text-cyber-green font-bold">// HƯỚNG DẪN NẠP FIRMWARE NHANH CHO MORPH S3:</div>
                        <div>1. Cắm cáp USB-C nối Morph S3 vào máy tính.</div>
                        <div>2. Bấm nút <strong>"KẾT NỐI THIẾT BỊ"</strong> ở góc trái và chọn đúng cổng COM.</div>
                        <div>3. Nếu máy không nhận cổng, giữ phím <strong>BOOT (GPIO 0)</strong> trong lúc cắm cáp USB để vào chế độ Bootloader ROM.</div>
                        <div>4. Bấm <strong>"BẮT ĐẦU GHI FIRMWARE"</strong> và chờ thanh tiến trình chạy đủ 100%.</div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="p-3 border-t border-cyber-border bg-cyber-void flex justify-between items-center">
                  <button
                    onClick={() => {
                      setSelectedBoardId('Morph-s3');
                      setShowMorphGuide(false);
                      playHackerSfx('blip', sfxEnabled);
                    }}
                    className="px-3 py-1.5 rounded bg-cyber-green text-cyber-void font-extrabold text-xs flex items-center gap-1.5 hover:bg-cyber-green/90">
                    <i className="fa-solid fa-check"></i>
                    <span>{t.morphSelectNow}</span>
                  </button>

                  <button
                    onClick={() => setShowMorphGuide(false)}
                    className="px-3 py-1.5 rounded border border-cyber-border bg-cyber-surface text-zinc-400 hover:text-white text-xs">
                    {t.morphCloseBtn}
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

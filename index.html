  <script type="module">
    import { Transport, ESPLoader, bstrToUi8 } from 'https://cdn.jsdelivr.net/npm/esptool-js@0.7.0/+esm';

    // Helper tạo Uint8Array đồng bộ chính xác với Realm / Scope của ESPLoader module
    const toModuleUint8Array = (input) => {
      if (!input) return new Uint8Array(0);
      if (input instanceof Uint8Array) {
        return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
      }
      if (input instanceof ArrayBuffer) {
        return new Uint8Array(input);
      }
      if (input.buffer && input.buffer instanceof ArrayBuffer) {
        return new Uint8Array(input.buffer, input.byteOffset || 0, input.byteLength || input.buffer.byteLength);
      }
      if (typeof input === 'string') {
        return bstrToUi8 ? bstrToUi8(input) : new TextEncoder().encode(input);
      }
      return new Uint8Array(input);
    };

    // Monkey-patch writeFlash prototype để bảo đảm cross-realm compatibility với Babel Standalone
    const origWriteFlash = ESPLoader.prototype.writeFlash;
    ESPLoader.prototype.writeFlash = async function(options) {
      if (options && Array.isArray(options.fileArray)) {
        for (let i = 0; i < options.fileArray.length; i++) {
          const item = options.fileArray[i];
          if (item && item.data !== undefined) {
            item.data = toModuleUint8Array(item.data);
          }
        }
      }
      return await origWriteFlash.call(this, options);
    };

    window.ESP_TOOLS = {
      Transport,
      ESPLoader,
      bstrToUi8,
      toUint8Array: toModuleUint8Array
    };
    window.dispatchEvent(new Event('esptool_ready'));
  </script>

    function App() {
      const [isConnected, setIsConnected] = useState(false);
      const [baudRate, setBaudRate] = useState(921600);
      const [eraseFlash, setEraseFlash] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('all');
      
      const [selectedBoardId, setSelectedBoardId] = useState('Morph-s3');
      const [localFile, setLocalFile] = useState(null);
      const [flashOffset, setFlashOffset] = useState('0x0000');
      
      // GitHub live detection
      const [githubFiles, setGithubFiles] = useState({});
      const [isFetchingGithub, setIsFetchingGithub] = useState(false);
      const [logoUrl, setLogoUrl] = useState(GITHUB_RAW_BASE + "IMG_4498.jpeg");

      // Chip info
      const [chipInfo, setChipInfo] = useState(null);

      // Flash & Terminal state
      const [isFlashing, setIsFlashing] = useState(false);
      const [isErasingOnly, setIsErasingOnly] = useState(false);
      const [progress, setProgress] = useState(0);
      const [logTab, setLogTab] = useState('pinout');
      const [sysLogs, setSysLogs] = useState([]);
      const [devLogs, setDevLogs] = useState([]);
      const [isMonitor, setIsMonitor] = useState(false);
      const [monitorBaud, setMonitorBaud] = useState(115200);

      // Morph S3 User Manual Modal State
      const [showMorphGuide, setShowMorphGuide] = useState(false);
      const [guideTab, setGuideTab] = useState('controls');

      // Quản lý Ngôn ngữ (Mặc định Tiếng Anh, cho phép chuyển đổi)
      const [lang, setLang] = useState(() => {
        const saved = localStorage.getItem('duscu_lang');
        if (saved === 'vi' || saved === 'en') return saved;
        return 'en';
      });

      const t = I18N[lang] || I18N.en;

      const toggleLang = () => {
        const nextLang = lang === 'vi' ? 'en' : 'vi';
        setLang(nextLang);
        localStorage.setItem('duscu_lang', nextLang);
      };

      const termRef = useRef(null);
      const portRef = useRef(null);
      const transportRef = useRef(null);
      const readerRef = useRef(null);
      const activeTransportRef = useRef(null);
      const isMonitorRef = useRef(false);
      const autoResumeMonitorRef = useRef(false);
      const logTabRef = useRef(logTab);
      useEffect(() => { logTabRef.current = logTab; }, [logTab]);
      const monitorBaudRef = useRef(monitorBaud);
      useEffect(() => { monitorBaudRef.current = monitorBaud; }, [monitorBaud]);

      // Đảm bảo đóng và giải phóng hoàn toàn cổng Serial
      const releaseAndClosePort = async (port) => {
        if (!port) return;
        if (activeTransportRef.current) {
          try {
            await activeTransportRef.current.disconnect();
          } catch(e) {}
          activeTransportRef.current = null;
        }
        if (transportRef.current) {
          try {
            await transportRef.current.disconnect();
          } catch(e) {}
          transportRef.current = null;
        }
        if (readerRef.current) {
          try {
            await readerRef.current.cancel();
          } catch(e) {}
          try {
            readerRef.current.releaseLock();
          } catch(e) {}
          readerRef.current = null;
        }
        try {
          if (port.readable || port.writable) {
            await port.close();
          }
        } catch(e) {
          console.warn("close port warning:", e);
        }
      };

      // Log utilities
      const logSys = (msg, type = 'info') => {
        setSysLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg, type }]);
      };
      const logDev = (msg) => {
        setDevLogs(prev => [...prev, { time: new Date().toLocaleTimeString('en-GB'), msg }]);
      };

      // Check GitHub repo contents on mount
      const fetchGithubContents = async () => {
        setIsFetchingGithub(true);
        try {
          const res = await fetch(GITHUB_API_URL + '?t=' + Date.now(), {
            headers: { 'Accept': 'application/vnd.github.v3+json' }
          });
          if (res.ok) {
            const data = await res.json();
            const map = {};
            if (Array.isArray(data)) {
              data.forEach(item => {
                if (item.name && item.name.endsWith('.bin')) {
                  map[item.name] = {
                    size: item.size,
                    download_url: item.download_url,
                    html_url: item.html_url
                  };
                }
              });
            }
            setGithubFiles(map);
            logSys(t.logSyncSuccess(Object.keys(map).length), 'success');
          } else {
            throw new Error(`HTTP ${res.status}`);
          }
        } catch (e) {
          logSys(t.logSyncWarn(e.message), 'warning');
        } finally {
          setIsFetchingGithub(false);
        }
      };

      // Tự động nhận diện IP người dùng để đặt Tiếng Việt hoặc Tiếng Anh
      useEffect(() => {
        const detectUserCountry = async () => {
          try {
            const res = await fetch('https://api.country.is', { signal: AbortSignal.timeout(3500) });
            if (res.ok) {
              const data = await res.json();
              const autoLang = (data.country === 'VN') ? 'vi' : 'en';
              setLang(autoLang);
              logSys(`[IP-GEO] Country: ${data.country || 'GLOBAL'} | Language: ${autoLang === 'vi' ? 'Tiếng Việt' : 'English'}`, 'info');
              return;
            }
          } catch(e1) {
            try {
              const res2 = await fetch('https://ipwho.is/', { signal: AbortSignal.timeout(3500) });
              if (res2.ok) {
                const data2 = await res2.json();
                const autoLang = (data2.country_code === 'VN') ? 'vi' : 'en';
                setLang(autoLang);
                logSys(`[IP-GEO] Country: ${data2.country_code || 'GLOBAL'} | Language: ${autoLang === 'vi' ? 'Tiếng Việt' : 'English'}`, 'info');
                return;
              }
            } catch(e2) {}
          }
        };

        logSys(t.logInit, "info");
        detectUserCountry();
        fetchGithubContents();
      }, []);

      useEffect(() => {
        const handleUsbDisconnect = (e) => {
          if (portRef.current && e.target && e.target !== portRef.current) return;
          logSys("[PORT] Thiết bị tạm ngắt kết nối (USB unplugged). Giữ nguyên log cũ & sẵn sàng tự kết nối lại...", "warning");
          if (isMonitorRef.current) {
            autoResumeMonitorRef.current = true;
          }
          isMonitorRef.current = false;
          setIsMonitor(false);
          if (readerRef.current) {
            try { readerRef.current.cancel(); } catch(err) {}
            try { readerRef.current.releaseLock(); } catch(err) {}
            readerRef.current = null;
          }
          setIsConnected(false);
        };

        const handleUsbConnect = (e) => {
          logSys("[PORT] Phát hiện thiết bị vừa cắm vào cổng USB. Tự động kết nối...", "success");
          const port = e.target;
          portRef.current = port;
          setIsConnected(true);
        setLogTab('sys');

          if (autoResumeMonitorRef.current || logTabRef.current === 'dev') {
            setTimeout(async () => {
              try {
                await startMonitor(port);
                logSys("[MONITOR] Tự động kích hoạt lại Serial Monitor thành công!", "success");
              } catch(err) {
                logSys(`[MONITOR] Thử kết nối lại tự động: ${err.message}`, "warning");
              }
            }, 450);
          }
        };

        if ('serial' in navigator) {
          navigator.serial.addEventListener('disconnect', handleUsbDisconnect);
          navigator.serial.addEventListener('connect', handleUsbConnect);
          return () => {
            navigator.serial.removeEventListener('disconnect', handleUsbDisconnect);
            navigator.serial.removeEventListener('connect', handleUsbConnect);
          };
        }
      }, []);

      useEffect(() => {
        if (termRef.current) termRef.current.scrollTop = termRef.current.scrollHeight;
      }, [sysLogs, devLogs, logTab]);

      // Tìm và kết nối cổng COM gần nhất (nếu có cấp quyền trước) hoặc yêu cầu chọn cổng
      const ensurePortConnected = async (promptUser = false) => {
        if (!('serial' in navigator)) {
          throw new Error(t.logNoWebSerial);
        }
        let port = portRef.current;
        if (!port && !promptUser) {
          try {
            const ports = await navigator.serial.getPorts();
            if (ports && ports.length > 0) {
              port = ports[ports.length - 1]; // Chọn cổng gần nhất đã cấp quyền
            }
          } catch(e) {}
        }
        if (!port) {
          port = await navigator.serial.requestPort();
        }
        if (port) {
          portRef.current = port;
          setIsConnected(true);
        setLogTab('sys');
        }
        return port;
      };

      // Serial Connection Logic
      const connectPort = async () => {
        try {
          if (!('serial' in navigator)) {
            throw new Error(t.logNoWebSerial);
          }
          if (!window.ESP_TOOLS) {
            throw new Error(t.logNoEsptool);
          }
          const port = await ensurePortConnected(true);
          await releaseAndClosePort(port);
          portRef.current = port;
          setIsConnected(true);
        setLogTab('sys');
          logSys(t.logPortSuccess, "success");

          // Tự động nhận diện Chip
          let probeTransport = null;
          try {
            probeTransport = new window.ESP_TOOLS.Transport(port);
            activeTransportRef.current = probeTransport;
            const esploader = new window.ESP_TOOLS.ESPLoader({
              transport: probeTransport,
              baudrate: 115200,
              terminal: { clean: ()=>{}, writeLine: ()=>{}, write: ()=>{} }
            });
            await esploader.main();
            const chipDesc = `${esploader.chip.CHIP_NAME || 'ESP-Device'}`;
            const macStr = esploader.macAddr ? esploader.macAddr().map(b => b.toString(16).padStart(2,'0')).join(':').toUpperCase() : 'N/A';
            setChipInfo({ chip: chipDesc, mac: macStr });
            logSys(`[CHIP] Model: ${chipDesc} | MAC: ${macStr}`, "success");
          } catch(e) {
            console.warn("Probe chip warning:", e);
          } finally {
            if (probeTransport) {
              await probeTransport.disconnect().catch(()=>{});
              probeTransport = null;
              activeTransportRef.current = null;
            }
            await releaseAndClosePort(port);
          }

        } catch (err) {
          logSys(t.logPortErr(err.message), "error");
        }
      };

      const disconnectPort = async () => {
        await stopMonitor(true);
        if (portRef.current) {
          await releaseAndClosePort(portRef.current);
          portRef.current = null;
        }
        setIsConnected(false);
        setChipInfo(null);
        logSys(t.logPortDisconnect, "warning");
      };

      // Serial Monitor Logic - Tự kết nối COM gần nhất, tự khôi phục khi cắm lại, hỗ trợ DTR kích hoạt ESP32-S3 & loop chống rớt
      const startMonitor = async (targetPort = null) => {
        if (isFlashing || isErasingOnly) return;
        autoResumeMonitorRef.current = true;
        try {
          let port = targetPort || portRef.current;
          if (!port) {
            port = await ensurePortConnected(false);
          }
          if (!port) return;

          // Mở port nếu chưa mở
          const baud = parseInt(monitorBaudRef.current) || 115200;
          try {
            if (!port.readable && !port.writable) {
              await port.open({ baudRate: baud });
            }
          } catch(openErr) {
            // Nếu port đang bận hoặc cần refresh baud, giải phóng và mở lại
            await releaseAndClosePort(port);
            await new Promise(r => setTimeout(r, 120));
            await port.open({ baudRate: baud });
          }

          // Tín hiệu phần cứng: DTR = true (BẮT BUỘC để ESP32-S3 USB CDC bắt đầu xuất dữ liệu Serial)
          // RTS = false (đảm bảo chân EN ở mức HIGH, chip chạy bình thường không bị kẹt trong bootloader)
          try {
            await port.setSignals({ dataTerminalReady: true, requestToSend: false });
          } catch(sigErr) {
            console.warn("setSignals warning:", sigErr);
          }

          isMonitorRef.current = true;
          setIsMonitor(true);
          setLogTab('dev');
          logSys(t.logMonitorStart(baud), 'success');

          const decoder = new TextDecoder();
          let partialLine = "";

          // Vòng lặp đọc 2 tầng theo chuẩn Spacehuhn / Web Serial:
          // Nếu gặp lỗi framing/parity tạm thời, tự động re-acquire reader mà không bao giờ đóng port hay mất icon
          while (isMonitorRef.current && (port.readable || portRef.current?.readable)) {
            const activePort = portRef.current || port;
            if (!activePort || !activePort.readable) break;

            try {
              const reader = activePort.readable.getReader();
              readerRef.current = reader;

              while (isMonitorRef.current) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                  partialLine += decoder.decode(value, { stream: true });
                  const lines = partialLine.split(/\r?\n/);
                  partialLine = lines.pop(); // Giữ lại phần chưa có ký tự xuống dòng
                  for (const line of lines) {
                    if (line.length > 0) logDev(line);
                  }
                }
              }
            } catch (readErr) {
              if (isMonitorRef.current) {
                console.warn("Serial glitch recovered:", readErr);
                await new Promise(r => setTimeout(r, 80));
              }
            } finally {
              if (readerRef.current) {
                try { readerRef.current.releaseLock(); } catch(e) {}
                readerRef.current = null;
              }
            }
          }
        } catch (err) {
          logSys(t.logMonitorErr(err.message), 'error');
          isMonitorRef.current = false;
          setIsMonitor(false);
        }
      };

      const stopMonitor = async (resetAutoResume = true) => {
        if (resetAutoResume) {
          autoResumeMonitorRef.current = false;
        }
        isMonitorRef.current = false;
        setIsMonitor(false);
        if (readerRef.current) {
          try { await readerRef.current.cancel(); } catch(e) {}
          try { readerRef.current.releaseLock(); } catch(e) {}
          readerRef.current = null;
        }
        if (transportRef.current) {
          try { await transportRef.current.disconnect(); } catch(e) {}
          transportRef.current = null;
          activeTransportRef.current = null;
        }
        if (portRef.current) {
          await releaseAndClosePort(portRef.current);
        }
      };

      // Full Chip Erase Only
      const handleEraseOnly = async () => {
        if (!isConnected || !portRef.current) return;
        if (!confirm(t.eraseConfirm)) return;

        setIsErasingOnly(true);
      setLogTab('sys');
        setLogTab('sys');
        logSys(t.logEraseStart, "warning");

        let eraseTransport = null;
        try {
          await stopMonitor();
          await releaseAndClosePort(portRef.current);
          await new Promise(r => setTimeout(r, 200));

          eraseTransport = new window.ESP_TOOLS.Transport(portRef.current);
          activeTransportRef.current = eraseTransport;
          const esploader = new window.ESP_TOOLS.ESPLoader({
            transport: eraseTransport,
            baudrate: parseInt(baudRate),
            terminal: { clean: ()=>{}, writeLine: (msg)=>logSys(msg, 'info'), write: (msg)=>logSys(msg, 'info') }
          });
          await esploader.main();
          logSys(t.logEraseExec, "info");
          await esploader.eraseFlash();
          logSys(t.logEraseSuccess, "success");
          try {
            if (typeof esploader.after === 'function') {
              await esploader.after("hard_reset");
            } else if (typeof esploader.hardReset === 'function') {
              await esploader.hardReset();
            }
          } catch(e) {}
        } catch (err) {
          logSys(t.logEraseFail(err.message), "error");
        } finally {
          if (eraseTransport) {
            try {
              await eraseTransport.disconnect();
            } catch(e) {}
            eraseTransport = null;
            activeTransportRef.current = null;
          }
          await releaseAndClosePort(portRef.current);
          setIsErasingOnly(false);
        }
      };

      // Flash Logic
      const handleFlash = async () => {
        const board = MASTER_BOARDS.find(b => b.id === selectedBoardId);

        if (!localFile && !board?.url) {
          return logSys(t.logNoTarget, "error");
        }
        if (!portRef.current) {
          return logSys(t.logPortErr("Chưa kết nối cổng Serial!"), "error");
        }

        setIsFlashing(true);
      setLogTab('sys');
        setProgress(0);
        setLogTab('sys');

        let flashTransport = null;
        try {
          await stopMonitor();
          await releaseAndClosePort(portRef.current);
          await new Promise(r => setTimeout(r, 200));

          let fwData = null;
          if (localFile) {
            logSys(t.logLocalFile(localFile.name, (localFile.size / 1048576).toFixed(2)), "info");
            const buf = await localFile.arrayBuffer();
            fwData = window.ESP_TOOLS?.toUint8Array ? window.ESP_TOOLS.toUint8Array(buf) : new Uint8Array(buf);
          } else {
            const remoteFile = board.url;
            logSys(t.logFetching(remoteFile), "info");
            const fetchUrl = GITHUB_RAW_BASE + remoteFile + '?t=' + Date.now();
            let resp = await fetch(fetchUrl);
            if (!resp.ok) {
              if (githubFiles[remoteFile]?.download_url) {
                resp = await fetch(githubFiles[remoteFile].download_url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
              } else {
                throw new Error(t.logFetchFail(remoteFile));
              }
            }
            const buf = await resp.arrayBuffer();
            fwData = window.ESP_TOOLS?.toUint8Array ? window.ESP_TOOLS.toUint8Array(buf) : new Uint8Array(buf);
          }

          if (!fwData || (fwData.length === 0 && fwData.byteLength === 0)) {
            throw new Error("Không thể tải nội dung firmware (Dữ liệu rỗng hoặc sai định dạng).");
          }

          logSys(t.logSyncBootloader(baudRate), "info");
          flashTransport = new window.ESP_TOOLS.Transport(portRef.current);
          activeTransportRef.current = flashTransport;

          const esploader = new window.ESP_TOOLS.ESPLoader({
            transport: flashTransport,
            baudrate: parseInt(baudRate),
            terminal: { clean: ()=>{}, writeLine: (msg) => logSys(msg, 'info'), write: (msg) => logSys(msg, 'info') }
          });

          await esploader.main();
          logSys(`[READY] Bootloader connected. Chip: ${esploader.chip.CHIP_NAME || 'ESP-Device'}`, "success");

          const writeOffset = parseInt(flashOffset, 16) || 0x0;
          logSys(t.logWriteFlash(writeOffset.toString(16).toUpperCase(), eraseFlash), "info");

          await esploader.writeFlash({
            fileArray: [{ data: fwData, address: writeOffset }],
            flashSize: 'keep',
            eraseAll: eraseFlash,
            compress: true,
            reportProgress: (fileIdx, written, total) => {
              const pct = Math.round((written / total) * 100);
              setProgress(pct);
            }
          });

          logSys("----------------------------------------", "success");
          logSys(t.logFlashSuccess, "success");
          logSys(t.logReboot, "info");
          logSys("----------------------------------------", "success");

          try {
            if (typeof esploader.after === 'function') {
              await esploader.after("hard_reset");
            } else if (typeof esploader.hardReset === 'function') {
              await esploader.hardReset();
            }
          } catch(e) {}
        } catch (err) {
          logSys(t.logFlashFail(err.message), "error");
        } finally {
          if (flashTransport) {
            try {
              await flashTransport.disconnect();
            } catch(e) {}
            flashTransport = null;
            activeTransportRef.current = null;
          }
          await releaseAndClosePort(portRef.current);
          setIsFlashing(false);
          setProgress(0);
        }
      };

                      logTab === 'pinout' ? 'text-amber-400 border-amber-500 bg-amber-500/10' : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-diagram-project text-[11px]"></i> {t.pinoutTab}
                  </button>
                  <button 
                    onClick={() => setLogTab('sys')} 
                    className={`py-2 px-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-1.5 ${
                      logTab === 'sys' ? 'text-amber-400 border-amber-500 bg-amber-500/10' : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-terminal text-[10px]"></i> {t.sysLogTab}
                  </button>
                  <button 
                    onClick={() => setLogTab('dev')} 
                    className={`py-2 px-3 text-xs font-bold uppercase tracking-wider border-b-2 transition-colors flex items-center gap-1.5 ${
                      logTab === 'dev' ? 'text-cyan-400 border-cyan-500 bg-cyan-500/10' : 'text-zinc-500 border-transparent hover:text-zinc-300'
                    }`}>
                    <i className="fa-solid fa-tv text-[10px]"></i> {t.serialMonTab}
                  </button>
                </div>

                <div className="flex items-center gap-1.5 py-1.5">
                  {logTab === 'dev' && (
                    <>
                      <select 
                        value={monitorBaud} 
                        onChange={e => setMonitorBaud(e.target.value)} 
                        disabled={isMonitor}
                        className="bg-zinc-950 border border-zinc-800 rounded px-2 py-0.5 text-xs font-mono text-zinc-300 outline-none">
                        <option value="115200">115200</option>
                        <option value="9600">9600</option>
                        <option value="921600">921600</option>
                      </select>

                      <button 
                        onClick={isMonitor ? () => stopMonitor(true) : () => startMonitor()} 
                        disabled={isFlashing || isErasingOnly} 
                        className={`px-2.5 py-1 rounded text-xs font-mono border transition-colors disabled:opacity-40 flex items-center gap-1 ${
                          isMonitor ? 'bg-zinc-800 text-rose-400 border-rose-500/40 hover:bg-rose-950/40' : 'bg-zinc-800 text-cyan-400 border-cyan-500/40 hover:bg-cyan-950/40'
                        }`}>
                        <i className={`fa-solid ${isMonitor ? 'fa-stop' : 'fa-play'} text-[10px]`}></i>
                        <span>{isMonitor ? t.stopMon : t.startMon}</span>
                      </button>
                    </>
                  )}

                  <button 
                    onClick={() => logTab === 'sys' ? setSysLogs([]) : setDevLogs([])} 
                    className="p-1 px-2 rounded border border-zinc-800 bg-zinc-950 text-zinc-400 hover:text-zinc-200 transition-colors" 
                    title={t.clearLogTooltip}>
                    <i className="fa-solid fa-trash-can text-xs"></i>
                  </button>
                </div>
              </div>

              {/* Console Log Area / Pinout Diagram Area */}
              {logTab === 'pinout' ? (
                <div className="flex-1 overflow-hidden bg-[#0a0a0c]">
                  <PinoutViewer boardId={selectedBoardId} lang={lang} />
                </div>
              ) : (
                <div 
                  ref={termRef} 
                  className="flex-1 p-3 overflow-y-auto font-mono text-[11px] leading-relaxed custom-scrollbar break-all text-zinc-300 select-text bg-[#0a0a0c]">
                  {(logTab === 'sys' ? sysLogs : devLogs).length === 0 ? (
                    <div className="text-zinc-700 select-none">
                      {logTab === 'sys' ? t.sysPlaceholder : t.monPlaceholder}
                    </div>
                  ) : (
                    (logTab === 'sys' ? sysLogs : devLogs).map((l, i) => (
                      <div key={i} className="flex gap-2 mb-0.5">
                        <span className="text-zinc-600 shrink-0 select-none">[{l.time}]</span>
                        <span className={`${
                          l.type === 'error' ? 'text-rose-500 font-semibold' : 
                          l.type === 'success' ? 'text-emerald-500 font-semibold' : 
                          l.type === 'warning' ? 'text-amber-500' : 
                          'text-zinc-300'
                        }`}>
                          {l.msg}
                        </span>
                      </div>
                    ))
                  )}
                </div>
              )}

              {/* HUD Status Bar */}
              <div className="px-3 py-1.5 border-t border-zinc-800 bg-zinc-900 flex items-center justify-between text-[11px] text-zinc-500 font-mono">
                <div className="flex items-center gap-2">
                  <span className="flex items-center gap-1.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isConnected ? 'bg-emerald-500' : 'bg-zinc-600'}`}></span>
                    <span>{isConnected ? t.portOnline : t.portOffline}</span>
                  </span>
                  {chipInfo && <span className="text-zinc-400">// {chipInfo.chip} [{chipInfo.mac}]</span>}
                </div>
                <div>ESPLoader 0.7.0</div>
              </div>

            </div>

          </main>

          {/* MORPH S3 USER GUIDE MODAL */}
          {showMorphGuide && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-4 select-text">
              <div className="bg-zinc-900 border border-zinc-700/80 rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                
                {/* Rainbow Accent Top Border */}
                <div className="h-1 w-full bg-gradient-to-r from-pink-500 via-amber-500 via-emerald-500 to-cyan-500"></div>

                {/* Modal Header */}
                <div className="p-4 border-b border-zinc-800 flex items-center justify-between gap-3 bg-zinc-950/80">
                  <div className="flex items-center gap-2.5 min-w-0">
                    <div className="w-8 h-8 rounded bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-sm shrink-0">
                      <i className="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div className="min-w-0">
                      <div className="flex items-center gap-2">
                        <h2 className="text-xs sm:text-sm font-bold font-mono text-zinc-100 tracking-wider truncate">
                          {t.morphGuideTitle}
                        </h2>
                        <span className="text-[9px] font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/30 px-1.5 py-0.5 rounded shrink-0">
                          ESP32-S3
                        </span>
                      </div>
                      <p className="text-[10px] sm:text-[11px] font-mono text-zinc-400 truncate">
                        {t.morphGuideSub}
                      </p>
                    </div>
                  </div>

                  <button 
                    onClick={() => setShowMorphGuide(false)}
                    className="w-7 h-7 rounded border border-zinc-800 hover:border-zinc-700 bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-100 flex items-center justify-center transition-colors shrink-0">
                    <i className="fa-solid fa-xmark text-xs"></i>
                  </button>
                </div>

                {/* Modal Tab Switchers */}
                <div className="flex border-b border-zinc-800 bg-zinc-950 px-3 overflow-x-auto custom-scrollbar font-mono text-xs gap-1 py-1.5 shrink-0">
                  {[
                    { id: 'controls', label: t.morphTabControls },
                    { id: 'hardware', label: t.morphTabHardware },
                    { id: 'webui',    label: t.morphTabWebui },
                    { id: 'flash',    label: t.morphTabFlash }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setGuideTab(tab.id)}
                      className={`px-3 py-1.5 rounded font-medium whitespace-nowrap transition-colors border ${
                        guideTab === tab.id 
                          ? 'bg-zinc-850 text-amber-300 border-amber-500/50 shadow-sm' 
                          : 'bg-transparent text-zinc-400 border-transparent hover:text-zinc-200 hover:bg-zinc-900'
                      }`}>
                      {tab.label}
                    </button>
                  ))}
                </div>

                {/* Modal Scrollable Body */}
                <div className="flex-1 overflow-y-auto p-4 space-y-4 font-mono text-xs text-zinc-300 custom-scrollbar leading-relaxed">
                  
                  {/* TAB 1: CONTROLS & NAVIGATION */}
                  {guideTab === 'controls' && (
                    <div className="space-y-3.5">
                      <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800/80">
                        <div className="flex items-center gap-2 text-amber-400 font-bold mb-2">
                          <i className="fa-solid fa-gamepad"></i>
                          <span>{lang === 'vi' ? '1. CHẾ ĐỘ 3 NÚT (TIÊU CHUẨN)' : '1. STANDARD 3-BUTTON MODE'}</span>
                        </div>
                        <ul className="space-y-1.5 text-zinc-300 text-[11px] list-disc list-inside">
                          <li><b className="text-zinc-100">UP (GPIO 16):</b> {lang === 'vi' ? 'Di chuyển lên trên / Giảm giá trị.' : 'Navigate UP / Decrement value.'}</li>
                          <li><b className="text-zinc-100">DOWN (GPIO 13):</b> {lang === 'vi' ? 'Di chuyển xuống dưới / Tăng giá trị.' : 'Navigate DOWN / Increment value.'}</li>
                          <li><b className="text-zinc-100">OK (GPIO 0):</b> {lang === 'vi' ? 'Nhấn 1 lần: Chọn / Mở menu (Enter). Nhấn giữ > 1.2s: Thoát / Trở về menu trước (Back / ESC).' : 'Single click: Enter / Select. Hold > 1.2s: Back / ESC.'}</li>
                        </ul>
                      </div>

                      <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800/80">
                        <div className="flex items-center gap-2 text-cyan-400 font-bold mb-2">
                          <i className="fa-solid fa-sliders"></i>
                          <span>{lang === 'vi' ? '2. CHẾ ĐỘ 2 NÚT (PHONG CÁCH T-DISPLAY S3)' : '2. 2-BUTTON MODE (T-DISPLAY S3 STYLE)'}</span>
                        </div>
                        <ul className="space-y-1.5 text-zinc-300 text-[11px] list-disc list-inside">
                          <li><b className="text-zinc-100">Nút Next (GPIO 13):</b> {lang === 'vi' ? 'Nhấn 1 lần: Di chuyển tới. Nhấp đúp (Double-click) hoặc Giữ: Chọn (OK / Enter).' : 'Single click: Next. Double-click or Hold: Select / Enter.'}</li>
                          <li><b className="text-zinc-100">Nút Prev (GPIO 16):</b> {lang === 'vi' ? 'Nhấn 1 lần: Di chuyển lùi. Nhấp đúp (Double-click) hoặc Giữ: Trở về (Back / ESC).' : 'Single click: Prev. Double-click or Hold: Back / ESC.'}</li>
                        </ul>
                      </div>

                      <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800/80">
                        <div className="flex items-center gap-2 text-emerald-400 font-bold mb-2">
                          <i className="fa-solid fa-circle-dot"></i>
                          <span>{lang === 'vi' ? '3. CHẾ ĐỘ CON LĂN (ROTARY ENCODER / T-EMBED)' : '3. ROTARY ENCODER MODE'}</span>
                        </div>
                        <ul className="space-y-1.5 text-zinc-300 text-[11px] list-disc list-inside">
                          <li><b className="text-zinc-100">{lang === 'vi' ? 'Xoay con lăn:' : 'Rotate Dial:'}</b> {lang === 'vi' ? 'Cuộn mượt mà lên hoặc xuống menu.' : 'Smoothly scroll menu items up or down.'}</li>
                          <li><b className="text-zinc-100">{lang === 'vi' ? 'Nhấn nút con lăn:' : 'Press Dial (OK):'}</b> {lang === 'vi' ? 'Xác nhận / Chọn mục.' : 'Confirm / Select.'}</li>
                          <li><b className="text-zinc-100">{lang === 'vi' ? 'Nút ESC phụ / Giữ:' : 'Aux Button / Hold:'}</b> {lang === 'vi' ? 'Thoát / Trở về.' : 'Exit / Back.'}</li>
                        </ul>
                      </div>

                      <div className="bg-zinc-950 p-2.5 rounded border border-rose-500/30 text-[11px] text-rose-300 flex items-start gap-2">
                        <i className="fa-solid fa-power-off mt-0.5 text-rose-400"></i>
                        <span>
                          {lang === 'vi' 
                            ? 'Tắt nguồn: Giữ nút L_BTN (hoặc L + R) trong 3 giây để đưa thiết bị vào chế độ Deep Sleep tiết kiệm pin.' 
                            : 'Power Off: Hold L_BTN (or L + R) for 3 seconds to enter Deep Sleep power-saving mode.'}
                        </span>
                      </div>
                    </div>
                  )}

                  {/* TAB 2: HARDWARE & PINOUT */}
                  {guideTab === 'hardware' && (
                    <div className="space-y-3">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px]">
                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-amber-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-microchip"></i>
                            <span>CHIP & BỘ NHỚ</span>
                          </div>
                          <p className="text-zinc-400">ESP32-S3 Dual-Core LX7 @ 240MHz</p>
                          <p className="text-emerald-400 font-semibold">16MB Flash • 8MB Octal-PSRAM</p>
                        </div>

                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-cyan-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-display"></i>
                            <span>MÀN HÌNH ST7789 IPS</span>
                          </div>
                          <p className="text-zinc-400">240x240 IPS (SPI 40MHz)</p>
                          <p className="text-zinc-400">MOSI: 10 • SCLK: 9 • CS: 14 • DC: 8</p>
                          <p className="text-zinc-400">RST: 18 • BL: 13 (PWM)</p>
                        </div>

                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-purple-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-tower-broadcast"></i>
                            <span>CC1101 SUB-GHZ (SPI)</span>
                          </div>
                          <p className="text-zinc-400">Tần số: 300 - 928 MHz</p>
                          <p className="text-zinc-400">SS: 2 • GDO0: 1</p>
                          <p className="text-zinc-400">MOSI: 48 • MISO: 41 • SCK: 47</p>
                        </div>

                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-green-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-wifi"></i>
                            <span>NRF24L01+ 2.4GHZ (SPI)</span>
                          </div>
                          <p className="text-zinc-400">MouseJacker / 2.4G Jammer</p>
                          <p className="text-zinc-400">CE: 4 • SS: 21</p>
                          <p className="text-zinc-400">MOSI: 48 • MISO: 41 • SCK: 47</p>
                        </div>

                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-blue-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-sd-card"></i>
                            <span>THẺ NHỚ MICROSD</span>
                          </div>
                          <p className="text-zinc-400">CS: 42 (Chung bus SPI)</p>
                          <p className="text-zinc-400">Hỗ trợ đọc file sub, pcap, badusb</p>
                        </div>

                        <div className="bg-zinc-950 p-2.5 rounded border border-zinc-800">
                          <div className="text-rose-400 font-bold mb-1 flex items-center gap-1.5">
                            <i className="fa-solid fa-network-wired"></i>
                            <span>GROVE I2C & BADUSB</span>
                          </div>
                          <p className="text-zinc-400">I2C Grove: SDA: 5 • SCL: 6</p>
                          <p className="text-zinc-400">Serial / BadUSB: RX: 44 • TX: 43</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* TAB 3: MORPH WEB CONFIG */}
                  {guideTab === 'webui' && (
                    <div className="space-y-3">
                      <div className="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded text-amber-300 text-[11px]">
                        <i className="fa-solid fa-circle-check mr-1.5"></i>
                        {lang === 'vi' 
                          ? 'Morph S3 tích hợp sẵn Web Config trực quan, cho phép đổi chân phím, xoay màn hình và tùy chỉnh phần cứng trực tiếp qua WiFi mà KHÔNG cần nạp lại code!'
                          : 'Morph S3 includes an onboard Web Config interface to reassign buttons, rotate display, and configure pins over WiFi without recompiling code!'}
                      </div>

                      <ol className="space-y-2 text-[11px] text-zinc-300 list-decimal list-inside bg-zinc-950 p-3 rounded-lg border border-zinc-800">
                        <li>
                          <b className="text-emerald-400">{lang === 'vi' ? 'BƯỚC 1 - NẠP CODE:' : 'STEP 1 - FLASH CODE:'}</b><br/>
                          <span className="text-zinc-400 ml-4">{lang === 'vi' ? 'Nạp firmware "Bruce-Morph-s3.bin" trực tiếp qua Web Flasher này (khuyến nghị chọn Xóa trước khi nạp).' : 'Flash "Bruce-Morph-s3.bin" directly via Web Flasher (Erase before flash recommended).'}</span>
                        </li>
                        <li>
                          <b className="text-cyan-400">{lang === 'vi' ? 'BƯỚC 2 - KẾT NỐI WIFI DO MẠCH PHÁT:' : 'STEP 2 - CONNECT TO MORPH WIFI:'}</b><br/>
                          <span className="text-zinc-400 ml-4">{lang === 'vi' ? 'Dùng điện thoại hoặc PC kết nối vào mạng Wi-Fi nó phát ra: ' : 'Connect phone or PC to the WiFi AP: '}</span>
                          <code className="text-amber-400 bg-zinc-900 px-1.5 py-0.5 rounded border border-zinc-800 ml-1">Morph-Config</code>
                          <span className="text-emerald-400 font-bold ml-2">({lang === 'vi' ? 'KHÔNG MẬT KHẨU' : 'NO PASSWORD'})</span>
                        </li>
                        <li>
                          <b className="text-amber-400">{lang === 'vi' ? 'BƯỚC 3 - TÙY CHỈNH CẤU HÌNH:' : 'STEP 3 - CONFIGURE HARDWARE:'}</b><br/>
                          <span className="text-zinc-400 ml-4">{lang === 'vi' ? 'Mở trình duyệt web và truy cập địa chỉ IP: ' : 'Open web browser and go to: '}</span>
                          <code className="text-cyan-400 font-bold bg-zinc-900 px-1.5 py-0.5 rounded border border-zinc-800 ml-1">http://192.168.4.1</code><br/>
                          <span className="text-zinc-400 ml-4">{lang === 'vi' ? 'Tùy chỉnh chế độ phím (1 nút Encoder / 2 nút / 3 nút / 5 nút), hướng xoay màn hình (0/90/180/270), chân CC1101, NRF24, thẻ nhớ SD, LED...' : 'Select button mode (Encoder / 2-Btn / 3-Btn / 5-Btn), screen rotation, pinouts for CC1101, NRF24, SD Card...'}</span>
                        </li>
                        <li>
                          <b className="text-purple-400">{lang === 'vi' ? 'BƯỚC 4 - LƯU CẤU HÌNH & REBOOT:' : 'STEP 4 - SAVE & REBOOT:'}</b><br/>
                          <span className="text-zinc-400 ml-4">{lang === 'vi' ? 'Kiểm tra không bị trùng chân đỏ rồi bấm SAVE & REBOOT. Thiết bị tự lưu vĩnh viễn vào Flash và khởi động lại!' : 'Check for pin conflicts, then click SAVE & REBOOT. Settings are permanently saved!'}</span>
                        </li>
                      </ol>
                    </div>
                  )}

                  {/* TAB 4: FLASHING INSTRUCTIONS */}
                  {guideTab === 'flash' && (
                    <div className="space-y-3">
                      <div className="bg-zinc-950 p-3 rounded-lg border border-zinc-800 space-y-2.5 text-[11px]">
                        <div className="flex items-center gap-2 text-emerald-400 font-bold">
                          <i className="fa-solid fa-bolt"></i>
                          <span>{lang === 'vi' ? 'CÁC BƯỚC NẠP FIRMWARE NHANH' : 'FAST FLASHING STEPS'}</span>
                        </div>
                        <ol className="space-y-1.5 list-decimal list-inside text-zinc-300">
                          <li>{lang === 'vi' ? 'Cắm cáp USB Type-C nối Morph S3 với máy tính (dùng Google Chrome hoặc MS Edge).' : 'Connect Morph S3 to PC via USB Type-C cable (use Chrome or Edge).'}</li>
                          <li>{lang === 'vi' ? 'Nếu máy tính chưa nhận: Giữ nút BOOT (GPIO 0) -> cắm cáp hoặc nhấn nút RESET để chip vào Bootloader.' : 'If not detected: Hold BOOT (GPIO 0) and click RESET to enter Bootloader.'}</li>
                          <li>{lang === 'vi' ? 'Bấm nút "KẾT NỐI THIẾT BỊ" góc trên bên trái, chọn cổng COM của ESP32-S3.' : 'Click "CONNECT DEVICE" and select the ESP32-S3 COM port.'}</li>
                          <li>{lang === 'vi' ? 'Chọn bo mạch "MORPH S3 FLAGSHIP" (file Bruce-Morph-s3.bin đã được tích hợp sẵn).' : 'Select "MORPH S3 FLAGSHIP" profile (Bruce-Morph-s3.bin is ready).'}</li>
                          <li>{lang === 'vi' ? 'Nên tích chọn "XÓA TRƯỚC KHI NẠP" (Full Erase) cho lần đầu nạp.' : 'Check "ERASE BEFORE FLASH" for first-time installation.'}</li>
                          <li>{lang === 'vi' ? 'Bấm nút "NẠP FIRMWARE" và đợi tiến trình đạt 100% là xong!' : 'Click "FLASH FIRMWARE" and wait for 100% completion!'}</li>
                        </ol>
                      </div>

                      <div className="text-center pt-2">
                        <button
                          onClick={() => {
                            setSelectedBoardId('Morph-s3');
                            setLocalFile(null);
                            setShowMorphGuide(false);
                          }}
                          className="w-full py-2.5 rounded bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold font-mono tracking-wider transition-colors shadow-lg shadow-amber-500/20 text-xs flex items-center justify-center gap-2">
                          <i className="fa-solid fa-wand-magic-sparkles"></i>
                          <span>{t.morphSelectNow}</span>
                        </button>
                      </div>
                    </div>
                  )}

                </div>

                {/* Modal Footer */}
                <div className="p-3 border-t border-zinc-800 bg-zinc-950 flex items-center justify-between font-mono text-xs">
                  <span className="text-[11px] text-zinc-500">Morph S3 Flagship • Bruce-v2</span>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => {
                        setSelectedBoardId('Morph-s3');
                        setLocalFile(null);
                        setShowMorphGuide(false);
                      }}
                      className="px-3 py-1.5 rounded bg-zinc-800 hover:bg-zinc-700 text-amber-400 border border-zinc-700 font-bold transition-colors">
                      {t.morphSelectNow}
                    </button>
                    <button
                      onClick={() => setShowMorphGuide(false)}
                      className="px-3 py-1.5 rounded bg-zinc-850 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 transition-colors">
                      {t.morphCloseBtn}
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
